  # ================================================================= BAZÉN
  - title: Bazén
    path: bazen
    icon: mdi:pool
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ruční ovládání
            icon: mdi:hand-back-right
          - type: tile
            entity: input_select.pool_manual
            name: Filtrace
            features:
              - type: select-options
          - type: tile
            entity: input_number.pool_manual_duration_h
            name: Platí
            visibility:
              - condition: state
                entity: input_select.pool_manual
                state_not: Auto
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: switch.filtrace_switch
            name: Čerpadlo
            tap_action:
              action: more-info
          - type: markdown
            content: |
              {% set c = 'sensor.pool_controller' %}
              **{{ states(c) }}** – {{ 'zapnout' if state_attr(c, 'pump_on') == 'ano' else 'vypnout' }}
              {{ '' if state_attr(c, 'executing') == 'ano' else '(jen doporučení)' }}

              {{ state_attr(c, 'reason') }}

              Solární starty dnes: {{ state_attr(c, 'solar_starts_today') }} / 4
      - type: grid
        cards:
          - type: heading
            heading: Hodiny (den 06–06)
            icon: mdi:timer-outline
          - type: markdown
            content: |
              {% set p = 'sensor.pool_plan' %}
              **{{ state_attr(p, 'done_h') | float(0) | round(1) }} / {{ state_attr(p, 'target_h') }} h**
              · slunce ~{{ state_attr(p, 'solar_hours_left') | float(0) | round(1) }} h
              · NT ~{{ state_attr(p, 'nt_hours_expected') | float(0) | round(1) }} h
          - type: tile
            entity: sensor.pool_hours_done_today
            name: Odběhnuto
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.pool_hours_recommended
            name: Doporučeno
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.pool_hours_required
            name: Požadováno
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
          - type: entities
            state_color: true
            entities:
              - entity: input_boolean.pool_season
                name: Sezóna bazénu
              - entity: input_boolean.pool_use_recommendation
                name: Filtrovat podle doporučení
          - type: statistics-graph
            title: Filtrace hodiny za den (14 dní)
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - max
            entities:
              - entity: sensor.filtrace_spustena
                name: Hodiny
      - type: grid
        cards:
          - type: heading
            heading: Voda
            icon: mdi:water
          - type: tile
            entity: sensor.davkovac_ph
            name: pH
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.davkovac_orp
            name: ORP
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.pool_water_temperature
            name: Teplota
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: history-graph
            title: pH a ORP (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.davkovac_ph
              - entity: sensor.davkovac_orp
      - type: grid
        cards:
          - type: heading
            heading: Parametry
            icon: mdi:tune
          - type: entities
            entities:
              - entity: input_number.pool_hours_min
              - entity: input_number.pool_hours_max
              - entity: input_number.pool_min_run_min
              - entity: input_number.filtrace_vykon_w


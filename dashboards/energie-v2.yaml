            icon: mdi:transmission-tower
          - type: statistics-graph
            grid_options:
              columns: full
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.energy_buy_sum
                name: Nákup HA
                color: "#ef9a9a"
              - entity: cez_pnd:859182400703740246_consumption
                name: Nákup PND
                color: "#c62828"
              - entity: sensor.energy_sell_sum
                name: Prodej HA
                color: "#a5d6a7"
              - entity: cez_pnd:859182400703740246_production
                name: Prodej PND
                color: "#2e7d32"

  # ============================================================ NASTAVENÍ
  - title: Nastavení
    path: nastaveni
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Řízení
            icon: mdi:robot
          - type: tile
            entity: input_select.energy_system_mode
            name: Režim systému
            features:
              - type: select-options
          - type: entities
            entities:
              - entity: input_boolean.energy_battery_control
              - entity: input_boolean.ev_control
              - entity: input_boolean.pool_control
              - entity: input_datetime.energy_override_until
      - type: grid
        cards:
          - type: heading
            heading: Zdraví zdrojů dat
            icon: mdi:heart-pulse
          - type: entities
            state_color: true
            entities:
              - entity: input_datetime.hav2_heartbeat
                name: AppDaemon heartbeat (max. 3 min)
                secondary_info: last-changed
              - type: attribute
                entity: sensor.energy_plan
                attribute: generated
                name: Plán baterie přepočten
                icon: mdi:calendar-refresh
                format: relative
              - type: attribute
                entity: sensor.energy_load_forecast
                attribute: source
                name: Profil spotřeby
                icon: mdi:chart-bell-curve
              - entity: binary_sensor.energy_forecast_valid
                name: Solcast předpověď
              - entity: sensor.solcast_pv_forecast_api_used
                name: Solcast API použito (limit 10)
                icon: mdi:api
              - entity: binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected
                name: EcoVolter (auto připojeno)
              - entity: sensor.ev6_last_updated_at
                name: Kia data aktualizována
                icon: mdi:car-clock
              - entity: binary_sensor.cez_hdo_lowtariffactive_dum
                name: HDO nízký tarif
              - entity: binary_sensor.spot_electricity_has_tomorrow_data_2
                name: Spot ceny na zítra
              - entity: sensor.pnd_data
                name: PND data stažena
                icon: mdi:file-compare
                secondary_info: last-updated
      - type: grid
        cards:
          - type: heading
            heading: Log rozhodnutí (24 h)
            icon: mdi:text-box-outline
          - type: logbook
            hours_to_show: 24
            target:
              entity_id:
                - input_text.energy_last_decision
                - input_text.ev_last_decision
                - input_text.pool_last_decision
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Všechny entity HAv2 (štítek hav2)
            icon: mdi:label
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
            filter:
              include:
                - label: hav2
                  domain: input_*
              exclude:
                - entity_id: input_datetime.hav2_heartbeat
            sort:
              method: name

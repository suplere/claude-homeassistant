              | | opraveno | Solcast |
              |---|---|---|
              | Zbytek dnes | {{ states(f) }} kWh | |
              | Dnes celkem | {{ state_attr(f, 'today_kwh') }} kWh | {{ state_attr(f, 'solcast_raw_today_kwh') }} kWh |
              | Zítra | {{ state_attr(f, 'tomorrow_kwh') }} kWh | {{ state_attr(f, 'solcast_raw_tomorrow_kwh') }} kWh |
              | Zítra konzervativně | {{ state_attr(f, 'tomorrow_conservative_kwh') }} kWh | |

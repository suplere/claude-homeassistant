# HAv2 – dashboard „Energie v2“ (docs/hav2-architektura.md §9)
# Zdroj pravdy pro storage dashboard `energie-v2`. Do HA se nahrává přes Lovelace API
# (lovelace/config/save), ne přes rsync. Úpravy dělat tady a znovu nahrát:
#   python dashboards/push_dashboard.py energie-v2 dashboards/energie-v2.yaml
# Časové řady plánu čte z atributů AppDaemon senzorů (slots_json = ISO čas).

title: Energie v2
views:
  # ================================================================ PŘEHLED
  - title: Přehled
    path: prehled
    icon: mdi:home-lightning-bolt
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: binary_sensor.cez_hdo_lowtariffactive_dum
        name: NT
        show_name: true
      - type: entity
        entity: sensor.energy_price_buy_now
        name: Nákup
        show_name: true
      - type: entity
        entity: sensor.energy_price_sell_now
        name: Prodej
        show_name: true
      - type: entity
        entity: binary_sensor.energy_boiler_heating
        name: Bojler
        show_name: true
      - type: entity
        entity: sensor.energy_breaker_headroom_a
        name: Rezerva jističe
        show_name: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Toky energie
            icon: mdi:transmission-tower
          - type: custom:power-flow-card-plus
            grid_options:
              columns: full
            watt_threshold: 1000
            kw_decimals: 2
            entities:
              solar:
                entity: sensor.pv_power
              battery:
                entity: sensor.battery_power
                state_of_charge: sensor.battery_state_of_charge
              grid:
                entity: sensor.meter_active_power_total
                invert_state: true
              home:
                entity: sensor.house_consumption
              individual:
                - entity: sensor.ecovolter_revcr01c00002056_actual_power
                  name: EV
                  icon: mdi:car-electric
                  display_zero: true
                - entity: sensor.bazenova_filtrace_vykon
                  name: Bazén
                  icon: mdi:pool
                  display_zero: true
          - type: heading
            heading: Fáze (+ prodej / − nákup)
            heading_style: subtitle
            icon: mdi:sine-wave
          - type: tile
            entity: sensor.meter_active_power_l1
            name: L1
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.meter_active_power_l2
            name: L2
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.meter_active_power_l3
            name: L3
            vertical: true
            grid_options:
              columns: 4
              rows: 2
      - type: grid
        cards:
          - type: heading
            heading: Systém
            icon: mdi:robot
          - type: tile
            entity: input_select.energy_system_mode
            name: Režim
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: select-options
          - type: entities
            title: HAv2 řídí
            state_color: true
            entities:
              - entity: input_boolean.energy_battery_control
                name: Baterii
              - entity: input_boolean.ev_control
                name: Nabíjení EV
              - entity: input_boolean.pool_control
                name: Filtraci
          - type: markdown
            content: |
              {% set m = states('input_select.energy_system_mode') %}
              {% if m != 'Auto' %}**Režim {{ m }}** – HAv2 nic nezapisuje, jen doporučuje.{% endif %}
              {% set ev = states('input_select.ev_manual') %}{% set pool = states('input_select.pool_manual') %}
              {% if ev != 'Auto' %}🚗 **EV ručně: {{ ev }}** ({{ states('input_select.ev_manual_until') }}){% endif %}
              {% if pool != 'Auto' %}🏊 **Filtrace ručně: {{ pool }}** (na {{ states('input_number.pool_manual_duration_h') | float(0) }} h){% endif %}
              {% set o = states('input_datetime.energy_override_until') | as_datetime(none) %}
              {% if o and o | as_local > now() %}✋ **Ruční zásah platí do {{ (o | as_local).strftime('%H:%M') }}**{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Rozhodnutí
            icon: mdi:lightbulb-on-outline
          - type: entities
            entities:
              - entity: sensor.energy_plan
                name: Baterie
                icon: mdi:home-battery
                secondary_info: last-changed
              - entity: sensor.ev_regulator
                name: EV
                icon: mdi:car-electric
                secondary_info: last-changed
              - entity: sensor.pool_controller
                name: Bazén
                icon: mdi:pool
                secondary_info: last-changed
          - type: markdown
            content: |
              **Baterie:** {{ states('input_text.energy_last_decision') }}

              **EV:** {{ states('input_text.ev_last_decision') }}

              **Bazén:** {{ states('input_text.pool_last_decision') }}
          - type: tile
            entity: sensor.battery_state_of_charge
            name: Baterie SOC
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_net_cost_daily
            name: Náklady dnes (netto)
            grid_options:
              columns: 6
  # ================================================================== PLÁN
  - title: Plán
    path: plan
    icon: mdi:chart-timeline-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Plán baterie a FVE (dnes a zítra)
            icon: mdi:chart-timeline-variant
          - &plan_chart
            type: custom:apexcharts-card
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            grid_options:
              columns: full
            graph_span: 32h
            span:
              start: hour
            now:
              show: true
              label: Teď
            header:
              show: true
              show_states: false
            apex_config:
              chart:
                height: 340
              legend:
                show: true
            yaxis:
              - id: kw
                min: -8
                max: 8
                decimals: 1
                apex_config:
                  title:
                    text: kW
              - id: soc
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: SOC %
            series:
              - entity: sensor.energy_pv_forecast_corrected
                name: FVE opravená
                unit: kW
                type: area
                color: "#f5a623"
                opacity: 0.3
                yaxis_id: kw
                data_generator: |
                  return (entity.attributes.slots || []).map(s => [new Date(s[0]).getTime(), s[1]]);
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Solcast p50
                unit: kW
                type: line
                color: "#bdbdbd"
                stroke_width: 1
                yaxis_id: kw
                data_generator: |
                  const t = hass.states['sensor.solcast_pv_forecast_forecast_tomorrow'];
                  const a = [...(entity.attributes.detailedForecast || []), ...((t && t.attributes.detailedForecast) || [])];
                  return a.map(s => [new Date(s.period_start).getTime(), s.pv_estimate]);
              - entity: sensor.energy_plan
                name: Nákup (plán)
                unit: kW
                type: column
                color: "#e53935"
                yaxis_id: kw
                data_generator: |
                  return JSON.parse(entity.attributes.slots_json || '[]').map(r => [new Date(r[0]).getTime(), -r[4] * 4]);
              - entity: sensor.energy_plan
                name: Prodej (plán)
                unit: kW
                type: column
                color: "#43a047"
                yaxis_id: kw
                data_generator: |
                  return JSON.parse(entity.attributes.slots_json || '[]').map(r => [new Date(r[0]).getTime(), r[5] * 4]);
              - entity: sensor.energy_plan
                name: SOC (plán)
                unit: "%"
                type: line
                color: "#1e88e5"
                stroke_width: 3
                yaxis_id: soc
                data_generator: |
                  return JSON.parse(entity.attributes.slots_json || '[]').map(r => [new Date(r[0]).getTime(), r[3]]);
          - <<: *plan_chart
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            graph_span: 12h
            apex_config:
              chart:
                height: 280
              legend:
                show: true
                fontSize: 11px
          - type: heading
            heading: Ceny (dnes a zítra)
            heading_style: subtitle
            icon: mdi:cash
          - &price_chart
            type: custom:apexcharts-card
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            grid_options:
              columns: full
            graph_span: 48h
            span:
              start: day
            now:
              show: true
              label: Teď
            header:
              show: false
            apex_config:
              chart:
                height: 260
            yaxis:
              - decimals: 1
                apex_config:
                  title:
                    text: Kč/kWh
            series:
              - entity: sensor.current_spot_electricity_price
                name: Prodej (spot × koef.)
                type: line
                curve: stepline
                color: "#43a047"
                data_generator: |
                  const k = parseFloat(hass.states['input_number.energy_sell_coefficient'].state) || 0.85;
                  return Object.entries(entity.attributes).filter(([t]) => t.includes('T'))
                    .map(([t, v]) => [new Date(t).getTime(), v * k]);
              - entity: sensor.cez_hdo_schedule_dum
                name: Nákup (NT/VT)
                type: line
                curve: stepline
                color: "#e53935"
                data_generator: |
                  const nt = parseFloat(hass.states['input_number.energy_price_nt'].state);
                  const vt = parseFloat(hass.states['input_number.energy_price_vt'].state);
                  return (entity.attributes.schedule || []).flatMap(s => {
                    const p = s.tariff === 'NT' ? nt : vt;
                    return [[new Date(s.start).getTime(), p], [new Date(s.end).getTime(), p]];
                  });
              - entity: input_number.energy_sell_min_spot
                name: Prodej z baterie od
                type: line
                color: "#8e24aa"
                stroke_width: 1
                data_generator: |
                  const v = parseFloat(entity.state) * (parseFloat(hass.states['input_number.energy_sell_coefficient'].state) || 0.85);
                  const d = new Date(); d.setHours(0, 0, 0, 0);
                  return [[d.getTime(), v], [d.getTime() + 48 * 3600e3, v]];
          - <<: *price_chart
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            graph_span: 24h
            span:
              start: hour
      - type: grid
        cards:
          - type: heading
            heading: Baterie – plán
            icon: mdi:home-battery
          - type: markdown
            text_only: true
            content: |
              **{{ state_attr('sensor.energy_plan', 'reason') }}**
              {{ '' if state_attr('sensor.energy_plan', 'executing') == 'ano' else '· jen doporučení' }}
          - type: entities
            entities:
              - entity: sensor.energy_plan
                name: Režim teď
                secondary_info: last-updated
              - type: attribute
                entity: sensor.energy_plan
                attribute: grid_charge_kwh
                name: Nabití ze sítě v NT
                icon: mdi:transmission-tower-import
                suffix: kWh
              - type: attribute
                entity: sensor.energy_plan
                attribute: sell_slots
                name: Prodejní sloty (15 min)
                icon: mdi:cash-fast
              - type: attribute
                entity: sensor.energy_plan
                attribute: soc_min_plan
                name: Nejnižší SOC v plánu
                icon: mdi:battery-low
                suffix: "%"
              - type: attribute
                entity: sensor.energy_plan
                attribute: pv_rest_today_kwh
                name: FVE zbytek dnes
                icon: mdi:solar-power
                suffix: kWh
              - type: attribute
                entity: sensor.energy_plan
                attribute: pv_tomorrow_kwh
                name: FVE zítra
                icon: mdi:solar-power-variant
                suffix: kWh
              - type: attribute
                entity: sensor.energy_plan
                attribute: load_tomorrow_kwh
                name: Spotřeba domu zítra
                icon: mdi:home-lightning-bolt
                suffix: kWh
              - type: attribute
                entity: sensor.energy_plan
                attribute: cost_today_rest
                name: Náklady zbytek dne
                icon: mdi:cash
                suffix: Kč
              - type: attribute
                entity: sensor.energy_plan
                attribute: cost_tomorrow
                name: Náklady zítra
                icon: mdi:cash-clock
                suffix: Kč
              - type: attribute
                entity: sensor.energy_plan
                attribute: forecast_ok
                name: Předpověď FVE platná
                icon: mdi:weather-sunny-alert
      - type: grid
        cards:
          - type: heading
            heading: EV a bazén – plán
            icon: mdi:calendar-clock
          - type: entities
            entities:
              - entity: sensor.ev_plan
                name: EV
                icon: mdi:car-electric
              - type: attribute
                entity: sensor.ev_plan
                attribute: solar_kwh
                name: EV ze slunce
                icon: mdi:solar-power
                suffix: kWh
              - type: attribute
                entity: sensor.ev_plan
                attribute: nt_kwh
                name: EV ze sítě v NT
                icon: mdi:weather-night
                suffix: kWh
              - type: attribute
                entity: sensor.ev_plan
                attribute: vt_kwh
                name: EV ze sítě ve VT
                icon: mdi:white-balance-sunny
                suffix: kWh
              - type: attribute
                entity: sensor.ev_plan
                attribute: est_grid_cost
                name: EV odhad nákladů ze sítě
                icon: mdi:cash
                suffix: Kč
              - entity: sensor.pool_plan
                name: Bazén
                icon: mdi:pool
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Plán po hodinách (24 h)
            icon: mdi:table-clock
          # počítač: všechny sloupce
          - type: custom:flex-table-card
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            grid_options:
              columns: full
            entities:
              include: sensor.energy_plan
            columns:
              - name: Čas
                data: table.t
              - name: Baterie
                data: table.rezim
              - name: kW
                data: table.kw
                align: right
              - name: SOC
                data: table.soc
                align: right
              - name: Nákup kWh
                data: table.nakup
                align: right
              - name: Prodej kWh
                data: table.prodej
                align: right
              - name: Tarif
                data: table.tarif
                align: center
              - name: Výkup Kč/kWh
                data: table.spot
                align: right
            css:
              table+: "width: 100%; border-collapse: collapse;"
              tbody tr:nth-child(odd): "background-color: rgba(127, 127, 127, 0.07);"
          # mobil: jen nejdůležitější sloupce
          - type: custom:flex-table-card
            visibility:
              - condition: screen
                media_query: "(max-width: 767px)"
            grid_options:
              columns: full
            entities:
              include: sensor.energy_plan
            columns:
              - name: Čas
                data: table.t
              - name: Baterie
                data: table.rezim
              - name: SOC
                data: table.soc
                align: right
              - name: Nákup
                data: table.nakup
                align: right
              - name: Prodej
                data: table.prodej
                align: right
            css:
              table+: "width: 100%; border-collapse: collapse; font-size: 0.9em;"
              tbody tr:nth-child(odd): "background-color: rgba(127, 127, 127, 0.07);"

  # ==================================================================== EV
  - title: EV
    path: ev
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ruční ovládání
            icon: mdi:hand-back-right
          - type: tile
            entity: input_select.ev_manual
            name: Nabíjení
            features:
              - type: select-options
          - type: tile
            entity: input_number.ev_manual_current
            name: Proud
            visibility:
              - condition: state
                entity: input_select.ev_manual
                state: Nabíjet teď
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_select.ev_manual_phases
            name: Fáze
            visibility:
              - condition: state
                entity: input_select.ev_manual
                state: Nabíjet teď
            features:
              - type: select-options
          - type: tile
            entity: input_select.ev_manual_until
            name: Platí
            visibility:
              - condition: state
                entity: input_select.ev_manual
                state_not: Auto
            features:
              - type: select-options
          - type: markdown
            visibility:
              - condition: state
                entity: input_boolean.ev_control
                state: "off"
            content: |
              <small>Řízení EV v HAv2 je vypnuté – ruční volba se zatím jen zaznamená
              do doporučení, wallbox neovládá.</small>
      - type: grid
        cards:
          - type: heading
            heading: Požadavek
            icon: mdi:target
          - type: tile
            entity: input_select.ev_mode
            name: Režim
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_number.ev_target_soc
            name: Cílový SOC
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: numeric-input
                style: slider
          - type: tile
            entity: input_datetime.ev_deadline
            name: Nabito do
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: date-set
          - type: tile
            entity: input_boolean.ev_deadline_hard
            name: Za každou cenu (i VT)
            grid_options:
              columns: 12
            features_position: inline
            features:
              - type: toggle
          - type: tile
            entity: sensor.ev_soc_estimate
            name: SOC (odhad)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_energy_needed_kwh
            name: Chybí do cíle
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_deadline_slack_h
            name: Rezerva do termínu
            visibility:
              - condition: state
                entity: sensor.ev_deadline_slack_h
                state_not: unavailable
            grid_options:
              columns: 12
          - type: markdown
            content: |
              {% set e = 'sensor.ev_plan' %}
              **Plán:** {{ states(e) }}

              Slunce {{ state_attr(e, 'solar_kwh') }} · NT {{ state_attr(e, 'nt_kwh') }} · VT {{ state_attr(e, 'vt_kwh') }} kWh
              {% if state_attr(e, 'shortfall_kwh') | float(0) > 0 %} · **chybí {{ state_attr(e, 'shortfall_kwh') }} kWh**{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Regulátor
            icon: mdi:current-ac
          - type: markdown
            content: |
              {% set r = 'sensor.ev_regulator' %}
              **{{ states(r) }}** – {{ 'nabíjet ' ~ state_attr(r, 'current_a') ~ ' A ' ~ state_attr(r, 'phases') if state_attr(r, 'enable') == 'ano' else 'stop' }}
              {{ '' if state_attr(r, 'executing') == 'ano' else '(jen doporučení)' }}

              {{ state_attr(r, 'reason') }}

              Přebytek pro EV {{ state_attr(r, 'surplus_for_ev_w') }} W · rezerva baterie {{ state_attr(r, 'battery_reserve_w') }} W
              · nejzatíženější fáze {{ state_attr(r, 'worst_phase_a') }} A · slunce se vrátí: {{ state_attr(r, 'sun_returns') }}
          - type: tile
            entity: binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected
            name: Připojeno
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ecovolter_revcr01c00002056_actual_power
            name: Výkon
            grid_options:
              columns: 6
          - type: tile
            entity: number.ecovolter_revcr01c00002056_target_current
            name: Proud wallboxu
            tap_action:
              action: more-info
            grid_options:
              columns: 6
          - type: tile
            entity: switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable
            name: 3 fáze
            tap_action:
              action: more-info
            grid_options:
              columns: 6
          - type: history-graph
            title: Výkon EV a přebytek (6 h)
            hours_to_show: 6
            entities:
              - entity: sensor.ecovolter_revcr01c00002056_actual_power
                name: EV kW
              - entity: sensor.energy_surplus_smoothed_w
                name: Přebytek W
      - type: grid
        cards:
          - type: heading
            heading: Aktuální session
            icon: mdi:ev-plug-type2
          - type: tile
            entity: sensor.ev_session_energy
            name: Energie
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.ev_session_cost
            name: Náklady
            vertical: true
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: sensor.ev_session_avg_price
            name: Kč/kWh
            vertical: true
            grid_options:
              columns: 4
              rows: 2
      - type: grid
        cards:
          - type: heading
            heading: Parametry regulace
            icon: mdi:tune
          - type: entities
            entities:
              - entity: input_number.ev_current_min
              - entity: input_number.ev_current_max
              - entity: input_number.ev_regulation_interval_s
              - entity: input_boolean.ev_allow_1f
              - entity: input_number.ev_support_min_soc
              - entity: input_number.ev_support_max_min
              - entity: input_number.ev_support_max_kwh
              - entity: input_number.ev_resume_after_min
              - entity: input_number.ev_battery_capacity_kwh
              - entity: input_number.ev_charge_efficiency

  # ============================================================ EV NÁKLADY
  - title: EV náklady
    path: ev-naklady
    icon: mdi:cash-multiple
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Souhrn
            icon: mdi:cash
          - type: tile
            entity: sensor.ev_charging_cost_monthly
            name: Tento měsíc
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_charging_cost_yearly
            name: Tento rok
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_charging_avg_price
            name: Průměrná cena
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_cost_per_100km
            name: Na 100 km
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_own_energy_share_pct
            name: Slunce + baterie
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_saving_vs_vt_monthly
            name: Úspora proti VT (měsíc)
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_charging_energy_total
            name: Nabito od 25. 9.
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ev_charging_cost_total
            name: Náklady od 25. 9.
            grid_options:
              columns: 6
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Denní náklady podle zdroje
            icon: mdi:chart-bar-stacked
          - type: statistics-graph
            grid_options:
              columns: full
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.ev_charging_cost_solar_total
                name: Slunce
                color: "#f5a623"
              - entity: sensor.ev_charging_cost_battery_total
                name: Baterie
                color: "#1e88e5"
              - entity: sensor.ev_charging_cost_grid_nt_total
                name: Síť NT
                color: "#43a047"

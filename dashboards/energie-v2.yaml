  # ================================================================ ÚSPORY
  - title: Úspory
    path: uspory
    icon: mdi:piggy-bank
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Náklady netto
            icon: mdi:cash
          - type: tile
            entity: sensor.energy_net_cost_daily
            name: Dnes
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_net_cost_monthly
            name: Měsíc
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_import_cost_total
            name: Nákup celkem
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_export_revenue_total
            name: Prodej celkem
            grid_options:
              columns: 6
          - type: heading
            heading: Kontrola proti PND
            heading_style: subtitle
            icon: mdi:file-compare
          - type: tile
            entity: sensor.energy_pnd_deviation_import_pct
            name: Odchylka nákupu
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_pnd_deviation_export_pct
            name: Odchylka prodeje
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.energy_grid_cross_energy
            name: Souběžný nákup+prodej
            grid_options:
              columns: 12
          - type: markdown
            text_only: true
            content: |
              <small>Odchylka je bez bojleru (ten je mimo měření GoodWe). Při malém prodeji
              zkresluje % rozlišení GoodWe 0,1 kWh.</small>
          - type: heading
            heading: Bojler podle PND (D+1)
            heading_style: subtitle
            icon: mdi:water-boiler
          - type: tile
            entity: sensor.energy_boiler_pnd_daily
            name: Bojler za poslední den
            grid_options:
              columns: 12
          - type: entities
            entities:
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: date
                name: Den
                icon: mdi:calendar
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: cost_kc
                name: Náklady (nákup ze sítě)
                icon: mdi:cash
                suffix: Kč
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: export_loss_kwh
                name: Z toho z přetoků
                icon: mdi:solar-power
                suffix: kWh
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: month_cost_kc
                name: Tento měsíc (do včerejška)
                icon: mdi:calendar-month
                suffix: Kč
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: month_kwh
                name: Tento měsíc energie
                icon: mdi:lightning-bolt
                suffix: kWh
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: avg_kwh_14d
                name: Průměr 14 dní
                icon: mdi:chart-bell-curve
                suffix: kWh/den
              - type: attribute
                entity: sensor.energy_boiler_pnd_daily
                attribute: avg_cost_14d
                name: Průměrné náklady 14 dní
                icon: mdi:cash-multiple
                suffix: Kč/den
          - type: custom:apexcharts-card
            graph_span: 14d
            span:
              end: day
            header:
              show: true
              title: Bojler po dnech (PND)
              show_states: false
            apex_config:
              chart:
                height: 220
            yaxis:
              - id: kwh
                min: 0
                decimals: 1
              - id: kc
                opposite: true
                min: 0
                decimals: 0
            series:
              - entity: sensor.energy_boiler_pnd_daily
                name: kWh
                type: column
                color: "#ef6c00"
                yaxis_id: kwh
                data_generator: |
                  return JSON.parse(entity.attributes.days_json || '[]').map(d => [new Date(d[0] + 'T12:00:00').getTime(), d[1]]);
              - entity: sensor.energy_boiler_pnd_daily
                name: Kč
                type: line
                color: "#e53935"
                yaxis_id: kc
                data_generator: |
                  return JSON.parse(entity.attributes.days_json || '[]').map(d => [new Date(d[0] + 'T12:00:00').getTime(), d[2]]);
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Denní náklady a výnosy
            icon: mdi:chart-bar
          - type: statistics-graph
            grid_options:
              columns: full
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - entity: sensor.energy_import_cost_total
                name: Nákup Kč
                color: "#e53935"
              - entity: sensor.energy_export_revenue_total
                name: Prodej Kč
                color: "#43a047"
          - type: heading

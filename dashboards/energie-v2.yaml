  # ============================================================ NASTAVENÍ
  - title: Nastavení
    path: nastaveni
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Řízení
            icon: mdi:robot
          - type: tile
            entity: input_select.energy_system_mode
            name: Režim systému
            features:
              - type: select-options
          - type: entities
            entities:
              - entity: input_boolean.energy_battery_control
              - entity: input_boolean.ev_control
              - entity: input_boolean.pool_control
              - entity: input_datetime.energy_override_until
      - type: grid
        cards:
          - type: heading
            heading: Zdraví zdrojů dat
            icon: mdi:heart-pulse
          - type: markdown
            content: |
              {% macro age(ts) %}{% set t = ts | as_datetime(none) %}{% if t %}{{ ((now() - t | as_local).total_seconds() / 60) | round(0) | int }} min{% else %}–{% endif %}{% endmacro %}
              {% macro ok(cond) %}{{ '✅' if cond else '⚠️' }}{% endmacro %}
              {% set hb = states('input_datetime.hav2_heartbeat') | as_datetime(none) %}
              {% set hb_ok = hb is not none and (now() - hb | as_local).total_seconds() < 180 %}
              | Zdroj | Stav |
              |---|---|
              | {{ ok(hb_ok) }} AppDaemon heartbeat | před {{ age(states('input_datetime.hav2_heartbeat')) }} |
              | {{ ok(is_state('binary_sensor.energy_forecast_valid', 'on')) }} Solcast | API {{ states('sensor.solcast_pv_forecast_api_used') }}/{{ states('sensor.solcast_pv_forecast_api_limit') }} |
              | {{ ok(has_value('switch.ecovolter_revcr01c00002056_is_charging_enable')) }} EcoVolter | {{ 'dostupný' if has_value('switch.ecovolter_revcr01c00002056_is_charging_enable') else 'nedostupný' }} |
              | {{ ok(has_value('sensor.ev6_ev_battery_level')) }} Kia data | stará {{ age(states('sensor.ev6_last_updated_at')) }} |
              | {{ ok(has_value('sensor.cez_hdo_schedule_dum')) }} HDO rozvrh | {{ states('binary_sensor.cez_hdo_lowtariffactive_dum') | replace('on', 'NT') | replace('off', 'VT') }} |
              | {{ ok(has_value('sensor.current_spot_electricity_price')) }} Spot | zítra: {{ 'ano' if is_state('binary_sensor.spot_electricity_has_tomorrow_data_2', 'on') else 'ne' }} |
              | {{ ok(has_value('sensor.pnd_data')) }} PND | poslední den {{ (state_attr('sensor.pnd_data', 'pnddate') or ['–']) | last }} |
              | {{ ok(states('sensor.energy_plan') != 'error') }} Plán baterie | {{ age(state_attr('sensor.energy_plan', 'generated')) }} · profil: {{ state_attr('sensor.energy_load_forecast', 'source') }} |
      - type: grid
        cards:
          - type: heading
            heading: Log rozhodnutí (24 h)
            icon: mdi:text-box-outline
          - type: logbook
            hours_to_show: 24
            target:
              entity_id:
                - input_text.energy_last_decision
                - input_text.ev_last_decision
                - input_text.pool_last_decision
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Všechny entity HAv2 (štítek hav2)
            icon: mdi:label
          - type: custom:auto-entities
            grid_options:
              columns: full
            show_empty: false
            card:
              type: entities
            filter:
              include:
                - label: hav2
                  domain: input_*
              exclude:
                - entity_id: input_datetime.hav2_heartbeat
            sort:
              method: name

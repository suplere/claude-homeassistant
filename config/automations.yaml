- id: '1717674886307'
  alias: 'FVE: solcast updates'
  description: New API call Solcast
  trigger:
  - platform: time
    at:
    - 06:30
    - 08:00
    - 09:00
    - '10:00'
    - '11:00'
    - '12:00'
    - '13:00'
    - '14:00'
    - '15:30'
    - '18:30'
  condition: []
  action:
  - service: solcast_solar.update_forecasts
    data: {}
  mode: single
- id: '1717828775243'
  alias: Přetoky nastavit
  description: Nastavení přetoků do sítě
  triggers:
  - entity_id:
    - sensor.current_spot_electricity_hour_order
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: numeric_state
      entity_id: sensor.current_spot_electricity_price
      below: 0
    then:
    - data: {}
      action: script.1717590841020
    - data:
        device_id: ebb0a36fdc7eb73781df6cf51cf4448f
        parameter: grid_export_limit
        value: 200
      action: goodwe.set_parameter
    - action: notify.mobile_app_evzen_iphone
      metadata: {}
      data:
        title: Omezený výkon FVE
        message: Jsou záporné ceny, nastaven omezený výkon elektrárny.
    else:
    - data: {}
      action: script.1717590811347
    - data:
        device_id: ebb0a36fdc7eb73781df6cf51cf4448f
        parameter: grid_export_limit
        value: 10000
      action: goodwe.set_parameter
  mode: single
- id: '1718351641005'
  alias: Ovládání filtrace - přetoky
  description: Filtrace běží jen pokud je baterie nabitá (SoC >= 95 %) a je reálný
    solární přebytek (pv_power při kladné ceně, Solcast power_now při záporné, kdy
    je pv_power kvůli exportnímu limitu nespolehlivý). Dobíjení baterie i nabíjení
    EV mají před filtrací přednost.
  triggers:
  - minutes: /5
    trigger: time_pattern
  - trigger: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    to: 'off'
  - trigger: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    to: 'on'
  conditions: []
  actions:
  - variables:
      filtrace_vykon: '{{ states(''input_number.filtrace_vykon_w'') | float(450) }}'
      ev_nabiji: '{{ is_state(''switch.ecovolter_revcr01c00002056_is_charging_enable'',
        ''on'') }}'
      ev_vykon: '{{ states(''sensor.eco_volter_vykon'') | float(0) if ev_nabiji else
        0 }}'
      je_cena_zaporna: '{{ states(''sensor.current_spot_electricity_price'') | float(0)
        < 0 }}'
      solar_now: '{{ states(''sensor.solcast_pv_forecast_power_now'') | float(0) if
        je_cena_zaporna else states(''sensor.pv_power'') | float(0) }}'
      base_spotreba: '{{ states(''sensor.base_house_consumption'') | float(0) }}'
      volny_vykon: '{{ solar_now - base_spotreba }}'
      volny_vykon_pro_filtraci: '{{ volny_vykon - ev_vykon }}'
      battery_soc: '{{ states(''sensor.battery_state_of_charge'') | float(0) }}'
      baterie_plna: '{{ battery_soc >= 95 }}'
      filtrace_bezi: '{{ is_state(''switch.filtrace_switch'', ''on'') }}'
      dost_slunce_zapnout: '{{ volny_vykon_pro_filtraci > (filtrace_vykon + 150) }}'
      dost_slunce_udrzet: '{{ volny_vykon_pro_filtraci > (filtrace_vykon - 150) }}'
      energy_buy_now: '{{ states(''sensor.energy_buy'') | float(0) }}'
      battery_discharge_now: '{{ states(''sensor.fve_battery_discharge_w'') | float(0)
        }}'
      system_v_preteceni: '{{ energy_buy_now > 1500 or battery_discharge_now > 2000 }}'
      muze_bezet: '{{ baterie_plna and not system_v_preteceni }}'
  - if:
    - condition: template
      value_template: '{{ muze_bezet and ((not filtrace_bezi and dost_slunce_zapnout)
        or (filtrace_bezi and dost_slunce_udrzet) or is_state(''input_boolean.time_to_use_overflows'',
        ''on'')) }}'
    then:
    - metadata: {}
      data: {}
      action: switch.turn_on
      target:
        entity_id: switch.filtrace_switch
    else:
    - metadata: {}
      data: {}
      action: switch.turn_off
      target:
        entity_id: switch.filtrace_switch
  mode: single
- id: '1772571943115'

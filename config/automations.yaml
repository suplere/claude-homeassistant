- id: ev_nabijeni_zaporne_ceny_pretoky
  alias: EV nabíjení - záporné ceny nebo přetoky
  description: Nabíjí EV 6A při záporné ceně OTE (jen se solárním přebytkem) nebo
    přetocích >4.1kW. Spravuje GoodWe export limit při záporných cenách.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    below: 0
    id: cena_zaporna
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    above: -0.001
    id: cena_kladna
  - trigger: numeric_state
    entity_id: sensor.energy_sell
    above: 3900
    for: 0:02:00
    id: pretoky_start
  - trigger: state
    entity_id: binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected
    to: 'on'
    id: auto_pripojeno
  - trigger: time_pattern
    minutes: /15
    id: periodic_check
  conditions: []
  actions:
  - variables:
      ma_nabijeni: '{{ is_state(''switch.ecovolter_revcr01c00002056_is_charging_enable'',
        ''on'') }}'
      je_cena_zaporna: '{{ states(''sensor.current_spot_electricity_price'') | float(0)
        < 0 }}'
      je_pretoky_velke: '{{ states(''sensor.energy_sell'') | float(0) > 4100 }}'
      je_vozidlo_pripojeno: '{{ is_state(''binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected'',
        ''on'') }}'
      ev6_soc: '{{ states(''sensor.ev6_ev_battery_level'') | int(0) }}'
      ev6_limit: '{{ states(''number.ev6_ac_charging_limit'') | int(80) }}'
      ev6_soc_ok: '{{ states(''sensor.ev6_ev_battery_level'') not in [''unavailable'',
        ''unknown''] }}'
      je_povoleno: '{{ is_state(''input_boolean.ev_nabijeni_povoleno'', ''on'') }}'
      je_solar_dost: '{{ states(''sensor.solcast_pv_forecast_power_now'') | float(0)
        > 1000 }}'
  - condition: template
    value_template: '{{ je_povoleno }}'
  - choose:
    - conditions:
      - condition: trigger
        id: pretoky_start
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and (not ev6_soc_ok
          or ev6_soc < ev6_limit) }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (přetoky). Nabíjení zastaveno.
        else:
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení spuštěno
            message: Přetoky >4.1 kW. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: trigger
        id: cena_zaporna
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and je_solar_dost
          and (not ev6_soc_ok or ev6_soc < ev6_limit) }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.goodwe_limit_dodavky_do_site
        data:
          value: 10000
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - action: number.set_value
          target:
            entity_id: number.goodwe_limit_dodavky_do_site
          data:
            value: 0
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (záporná cena). Nabíjení zastaveno.
        else:
        - delay: 0:00:45
        - if:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.energy_buy
              above: 1500
            - condition: numeric_state
              entity_id: sensor.fve_battery_discharge_w
              above: 3000
          then:
          - if:
            - condition: state
              entity_id: switch.bazen_filtrace_rele
              state: 'on'
            then:
            - action: switch.turn_off
              target:
                entity_id: switch.bazen_filtrace_rele
            - action: notify.mobile_app_evzen_iphone
              data:
                title: Filtrace vypnuta
                message: Nedostatek solárů - filtrace vypnuta přednostně, aby nabíjení
                  EV mohlo pokračovat.
            - delay: 0:01:00
            - condition: or
              conditions:
              - condition: numeric_state
                entity_id: sensor.energy_buy
                above: 1500
              - condition: numeric_state
                entity_id: sensor.fve_battery_discharge_w
                above: 3000
          - action: switch.turn_off
            target:
              entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
          - action: number.set_value
            target:
              entity_id: number.goodwe_limit_dodavky_do_site
            data:
              value: 0
          - action: notify.mobile_app_evzen_iphone
            data:
              title: EV nabíjení zastaveno
              message: Nedostatek solárů (import > 1.5 kW). Nabíjení EV zastaveno.
          else:
          - action: notify.mobile_app_evzen_iphone
            data:
              title: EV nabíjení spuštěno
              message: Záporná cena + solár. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: auto_pripojeno
        - condition: trigger
          id: periodic_check
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and (not ev6_soc_ok
          or ev6_soc < ev6_limit) }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ je_pretoky_velke }}'
        - condition: template
          value_template: '{{ je_cena_zaporna and je_solar_dost }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ je_cena_zaporna }}'
        then:
        - action: number.set_value
          target:
            entity_id: number.goodwe_limit_dodavky_do_site
          data:
            value: 10000
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - if:
          - condition: template
            value_template: '{{ je_cena_zaporna }}'
          then:
          - action: number.set_value
            target:
              entity_id: number.goodwe_limit_dodavky_do_site
            data:
              value: 0
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (připojení vozu). Nabíjení zastaveno.
        else:
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení spuštěno
            message: Auto připojeno, podmínky splněny. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: trigger
        id: cena_kladna
      - condition: template
        value_template: '{{ ma_nabijeni and not je_pretoky_velke }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - action: notify.mobile_app_evzen_iphone
        data:
          title: EV nabíjení zastaveno
          message: Cena kladná a přetoky <4.1 kW. Nabíjení EV zastaveno.
  mode: queued
  max: 5
- id: ev_zastavit_velky_import
  alias: EV zastavit - příliš velký import
  description: Zastaví nabíjení EV pokud import ze sítě překročí 1.5 kW nebo vybíjení
    baterie překročí 2 kW po dobu 2 minut. Neplatí při manuálním NT nabíjení (import
    ze sítě je tam žádaný stav).
  triggers:
  - trigger: numeric_state
    id: sit_import
    entity_id: sensor.energy_buy
    above: 1500
    for: 0:02:00
  - trigger: numeric_state
    id: baterie_vybijeni
    entity_id: sensor.fve_battery_discharge_w
    above: 2000
    for: 0:02:00
  conditions:
  - condition: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    state: 'on'
  - condition: state
    entity_id: input_boolean.ev_nabijeni_povoleno
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.ev_nabijeni_manualni_nt
      state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
  - if:
    - condition: numeric_state
      entity_id: sensor.current_spot_electricity_price
      below: 0
    then:
    - action: number.set_value
      target:
        entity_id: number.goodwe_limit_dodavky_do_site
      data:
        value: 0
  - action: notify.mobile_app_evzen_iphone
    data:
      title: EV nabíjení zastaveno
      message: '{% if trigger.id == ''baterie_vybijeni'' %} Vybíjení baterie > 2 kW
        po dobu 2 min. Nabíjení EV zastaveno. {% else %} Import ze sítě > 1.5 kW po
        dobu 2 min — málo solárů. Nabíjení EV zastaveno. {% endif %}'
  mode: single
- id: '1778526312883'
  alias: Run PND
  description: ''
  triggers:
  - at: 06:00:00
    trigger: time
  conditions: []
  actions:
  - event: run_pnd
    event_data: {}
  mode: single
- id: '1778526595548'
  alias: Run actions after AppDaemon starts
  description: Spustí PND po startu AppDaemonu s prodlevou 15 sekund pro zajištění
    závislostí
  triggers:
  - event_type: APPDAEMON_READY
    trigger: event
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - event: run_pnd
    event_data: {}
  mode: single

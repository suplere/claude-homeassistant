- id: predictive_overflow_negative_price
  alias: Prediktivni pretoky pri zaporne cene
  description: Pri zapornych cenach prebirame rizeni pretoku od blueprintu Time to
    Use Overflow. Pouziva Solcast predpoved a stav baterie pro prediktivni rozhodovani.
  mode: queued
  max: 5
  triggers:
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    below: 0
    id: price_negative
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    above: 0
    id: price_positive
  - trigger: numeric_state
    entity_id: sensor.battery_state_of_charge
    above: 80
    id: battery_rising
  - trigger: time_pattern
    minutes: /15
    id: periodic
  conditions: []
  actions:
  - variables:
      battery_soc: '{{ states(''sensor.battery_state_of_charge'') | float(0) }}'
      battery_capacity: '{{ states(''input_number.battery_capacity'') | float(10)
        }}'
      forecast_remaining: '{{ states(''sensor.solcast_pv_forecast_forecast_remaining_today'')
        | float(0) }}'
      avg_daily_consumption: '{{ states(''sensor.base_average_daily_consumption'')
        | float(0) }}'
      hours_until_evening: '{{ [((today_at(''20:00'') - now()).total_seconds() / 3600),
        0] | max }}'
      remaining_battery_capacity: '{{ (100 - battery_soc) / 100 * battery_capacity
        }}'
      remaining_consumption: '{{ avg_daily_consumption * hours_until_evening / 24
        }}'
      predicted_overflow: '{{ forecast_remaining - remaining_battery_capacity - remaining_consumption
        }}'
      current_month: '{{ now().month }}'
      is_summer_season: '{{ current_month in [4, 5, 6, 7, 8, 9] }}'
      is_daytime: '{{ hours_until_evening > 0 }}'
      should_enable_overflow: '{{ is_summer_season and is_daytime and (battery_soc
        >= 80 or predicted_overflow > 1) }}'
      spot_price: '{{ states(''sensor.current_spot_electricity_price'') | float(0)
        }}'
      is_negative_price: '{{ spot_price < 0 }}'
  - choose:
    - conditions:
      - condition: trigger
        id: price_negative
      sequence:
      - action: automation.turn_off
        target:
          entity_id: automation.time_to_use_overflow
        data:
          stop_actions: true
      - if:
        - condition: template
          value_template: '{{ should_enable_overflow }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.time_to_use_overflows
        - action: notify.mobile_app_evzen_iphone
          data:
            title: Prediktivni pretoky
            message: 'Zaporna cena ({{ spot_price }} CZK). Blueprint deaktivovan,
              pretoky zapnuty. SoC: {{ battery_soc }}%, predpovedeny prebytek: {{
              predicted_overflow | round(1) }} kWh.'
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.time_to_use_overflows
        - action: notify.mobile_app_evzen_iphone
          data:
            title: Prediktivni pretoky
            message: 'Zaporna cena ({{ spot_price }} CZK). Blueprint deaktivovan,
              pretoky zatim vypnuty. SoC: {{ battery_soc }}%, predpovedeny prebytek:
              {{ predicted_overflow | round(1) }} kWh.'
    - conditions:
      - condition: trigger
        id:
        - battery_rising
        - periodic
      - condition: template
        value_template: '{{ is_negative_price }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ should_enable_overflow }}'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.time_to_use_overflows
        else:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.time_to_use_overflows
    - conditions:
      - condition: trigger
        id: price_positive
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.time_to_use_overflows
      - action: automation.turn_on
        target:
          entity_id: automation.time_to_use_overflow
      - action: notify.mobile_app_evzen_iphone
        data:
          title: Prediktivni pretoky
          message: Cena zpet kladna ({{ spot_price }} CZK). Blueprint reaktivovan,
            rizeni vraceno.
- id: kia_ev6_force_update_on_charge
  alias: 'KIA EV6: force update při začátku nabíjení'
  description: Při reálném startu nabíjení (actual_power > 0.3 kW) vyžádá aktuální
    data z auta pro čerstvý SoC.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ecovolter_revcr01c00002056_actual_power
    above: 0.3
    for: 0:01:00
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered == none or (now() - this.attributes.last_triggered).total_seconds()
      > 3600 }}'
  actions:
  - action: kia_uvo.force_update
    target:
      device_id: 2758b89b148f1176f740b6d11130c2d9
  mode: single
- id: ev_nabijeni_zaporne_ceny_pretoky
  alias: EV nabíjení - záporné ceny nebo přetoky
  description: Nabíjí EV 6A při záporné ceně OTE (jen se solárním přebytkem) nebo
    přetocích >4.1kW. Spravuje GoodWe export limit při záporných cenách.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    below: 0
    id: cena_zaporna
  - trigger: numeric_state
    entity_id: sensor.current_spot_electricity_price
    above: -0.001
    id: cena_kladna
  - trigger: numeric_state
    entity_id: sensor.energy_sell
    above: 3900
    for: 0:02:00
    id: pretoky_start
  - trigger: state
    entity_id: binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected
    to: 'on'
    id: auto_pripojeno
  - trigger: time_pattern
    minutes: /15
    id: periodic_check
  conditions: []
  actions:
  - variables:
      ma_nabijeni: '{{ is_state(''switch.ecovolter_revcr01c00002056_is_charging_enable'',
        ''on'') }}'
      je_cena_zaporna: '{{ states(''sensor.current_spot_electricity_price'') | float(0)
        < 0 }}'
      je_pretoky_velke: '{{ states(''sensor.energy_sell'') | float(0) > 4100 }}'
      je_vozidlo_pripojeno: '{{ is_state(''binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected'',
        ''on'') }}'
      ev6_soc: '{{ states(''sensor.ev6_ev_battery_level'') | int(0) }}'
      ev6_limit: '{{ states(''number.ev6_ac_charging_limit'') | int(80) }}'
      ev6_soc_ok: '{{ states(''sensor.ev6_ev_battery_level'') not in [''unavailable'',
        ''unknown''] }}'
      je_povoleno: '{{ is_state(''input_boolean.ev_nabijeni_povoleno'', ''on'') }}'
      je_solar_dost: '{{ states(''sensor.solcast_pv_forecast_power_now'') | float(0)
        > 1000 }}'
  - condition: template
    value_template: '{{ je_povoleno }}'
  - choose:
    - conditions:
      - condition: trigger
        id: pretoky_start
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and (not ev6_soc_ok
          or ev6_soc < ev6_limit) }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (přetoky). Nabíjení zastaveno.
        else:
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení spuštěno
            message: Přetoky >4.1 kW. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: trigger
        id: cena_zaporna
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and je_solar_dost
          and (not ev6_soc_ok or ev6_soc < ev6_limit) }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.goodwe_limit_dodavky_do_site
        data:
          value: 10000
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - action: number.set_value
          target:
            entity_id: number.goodwe_limit_dodavky_do_site
          data:
            value: 0
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (záporná cena). Nabíjení zastaveno.
        else:
        - delay: 0:00:45
        - if:
          - condition: or
            conditions:
            - condition: numeric_state
              entity_id: sensor.energy_buy
              above: 1500
            - condition: numeric_state
              entity_id: sensor.fve_battery_discharge_w
              above: 3000
          then:
          - if:
            - condition: state
              entity_id: switch.filtrace_switch
              state: 'on'
            then:
            - action: switch.turn_off
              target:
                entity_id: switch.filtrace_switch
            - action: notify.mobile_app_evzen_iphone
              data:
                title: Filtrace vypnuta
                message: Nedostatek solárů - filtrace vypnuta přednostně, aby nabíjení
                  EV mohlo pokračovat.
            - delay: 0:01:00
            - condition: or
              conditions:
              - condition: numeric_state
                entity_id: sensor.energy_buy
                above: 1500
              - condition: numeric_state
                entity_id: sensor.fve_battery_discharge_w
                above: 3000
          - action: switch.turn_off
            target:
              entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
          - action: number.set_value
            target:
              entity_id: number.goodwe_limit_dodavky_do_site
            data:
              value: 0
          - action: notify.mobile_app_evzen_iphone
            data:
              title: EV nabíjení zastaveno
              message: Nedostatek solárů (import > 1.5 kW). Nabíjení EV zastaveno.
          else:
          - action: notify.mobile_app_evzen_iphone
            data:
              title: EV nabíjení spuštěno
              message: Záporná cena + solár. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: auto_pripojeno
        - condition: trigger
          id: periodic_check
      - condition: template
        value_template: '{{ not ma_nabijeni and je_vozidlo_pripojeno and (not ev6_soc_ok
          or ev6_soc < ev6_limit) }}'
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ je_pretoky_velke }}'
        - condition: template
          value_template: '{{ je_cena_zaporna and je_solar_dost }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ je_cena_zaporna }}'
        then:
        - action: number.set_value
          target:
            entity_id: number.goodwe_limit_dodavky_do_site
          data:
            value: 10000
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: 6
      - action: switch.turn_on
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
          | float(0) > 0.3 }}'
        timeout: 0:01:30
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ wait.timed_out }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        - if:
          - condition: template
            value_template: '{{ je_cena_zaporna }}'
          then:
          - action: number.set_value
            target:
              entity_id: number.goodwe_limit_dodavky_do_site
            data:
              value: 0
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení - chyba
            message: Auto nepřijímá nabíjení (připojení vozu). Nabíjení zastaveno.
        else:
        - action: notify.mobile_app_evzen_iphone
          data:
            title: EV nabíjení spuštěno
            message: Auto připojeno, podmínky splněny. Nabíjení EV 6A aktivní.
    - conditions:
      - condition: trigger
        id: cena_kladna
      - condition: template
        value_template: '{{ ma_nabijeni and not je_pretoky_velke }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - action: notify.mobile_app_evzen_iphone
        data:
          title: EV nabíjení zastaveno
          message: Cena kladná a přetoky <4.1 kW. Nabíjení EV zastaveno.
  mode: queued
  max: 5
- id: ev_zastavit_velky_import
  alias: EV zastavit - příliš velký import
  description: Zastaví nabíjení EV pokud import ze sítě překročí 1.5 kW nebo vybíjení
    baterie překročí 2 kW po dobu 2 minut. Neplatí při manuálním NT nabíjení (import
    ze sítě je tam žádaný stav).
  triggers:
  - trigger: numeric_state
    id: sit_import
    entity_id: sensor.energy_buy
    above: 1500
    for: 0:02:00
  - trigger: numeric_state
    id: baterie_vybijeni
    entity_id: sensor.fve_battery_discharge_w
    above: 2000
    for: 0:02:00
  conditions:
  - condition: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    state: 'on'
  - condition: state
    entity_id: input_boolean.ev_nabijeni_povoleno
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.ev_nabijeni_manualni_nt
      state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
  - if:
    - condition: numeric_state
      entity_id: sensor.current_spot_electricity_price
      below: 0
    then:
    - action: number.set_value
      target:
        entity_id: number.goodwe_limit_dodavky_do_site
      data:
        value: 0
  - action: notify.mobile_app_evzen_iphone
    data:
      title: EV nabíjení zastaveno
      message: '{% if trigger.id == ''baterie_vybijeni'' %} Vybíjení baterie > 2 kW
        po dobu 2 min. Nabíjení EV zastaveno. {% else %} Import ze sítě > 1.5 kW po
        dobu 2 min — málo solárů. Nabíjení EV zastaveno. {% endif %}'
  mode: single
- id: ev_zastavit_plna_baterie
  alias: EV zastavit - auto přestalo nabíjet
  description: Detekuje že auto přestalo přijímat proud (actual_power < 0.3 kW po
    dobu 5 min) a uklidí goodwe_limit při záporné ceně.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.ecovolter_revcr01c00002056_actual_power
    below: 0.3
    for: 0:05:00
  conditions:
  - condition: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    state: 'on'
  - condition: state
    entity_id: input_boolean.ev_nabijeni_povoleno
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
  - if:
    - condition: numeric_state
      entity_id: sensor.current_spot_electricity_price
      below: 0
    then:
    - action: number.set_value
      target:
        entity_id: number.goodwe_limit_dodavky_do_site
      data:
        value: 0
  - action: notify.mobile_app_evzen_iphone
    data:
      title: EV nabíjení zastaveno
      message: Auto přestalo přijímat proud. Nabíjení ukončeno.
  mode: single
- id: ev_regulace_proudu
  alias: EV regulace proudu při nabíjení
  description: Každé 2 min upravuje nabíjecí proud 6–11A podle přetoků, importu a
    vybíjení baterie, bez ohledu na znaménko spotové ceny. Před zvýšením proudu nejdřív
    zapne filtraci (aby využila přebytek dřív než EV), před vypnutím nabíjení nejdřív
    sníží proud na 6A a zkusí vypnout filtraci. Neběží při manuálním NT nabíjení
    (proud tam řídí start automatika, dům běží na grid).
  triggers:
  - trigger: time_pattern
    minutes: /2
  conditions:
  - condition: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    state: 'on'
  - condition: state
    entity_id: input_boolean.ev_nabijeni_povoleno
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_boolean.ev_nabijeni_manualni_nt
      state: 'on'
  actions:
  - variables:
      aktualni_proud: '{{ states(''number.ecovolter_revcr01c00002056_target_current'')
        | float(6) }}'
      energy_sell: '{{ states(''sensor.energy_sell'') | float(0) }}'
      energy_buy: '{{ states(''sensor.energy_buy'') | float(0) }}'
      battery_discharge: '{{ states(''sensor.fve_battery_discharge_w'') | float(0)
        }}'
      filtrace_bezi: '{{ is_state(''switch.filtrace_switch'', ''on'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ energy_sell > 500 and aktualni_proud < 11 }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ not filtrace_bezi }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: switch.filtrace_switch
        - delay: 0:00:45
        - if:
          - condition: template
            value_template: '{{ states(''sensor.energy_sell'') | float(0) > 500 }}'
          then:
          - action: number.set_value
            target:
              entity_id: number.ecovolter_revcr01c00002056_target_current
            data:
              value: '{{ [aktualni_proud + 1, 11] | min }}'
        else:
        - action: number.set_value
          target:
            entity_id: number.ecovolter_revcr01c00002056_target_current
          data:
            value: '{{ [aktualni_proud + 1, 11] | min }}'
    - conditions:
      - condition: template
        value_template: '{{ (energy_buy > 1500 or battery_discharge > 2000) and aktualni_proud
          > 6 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.ecovolter_revcr01c00002056_target_current
        data:
          value: '{{ [aktualni_proud - 1, 6] | max }}'
    - conditions:
      - condition: template
        value_template: '{{ (energy_buy > 1500 or battery_discharge > 2000) and aktualni_proud
          <= 6 }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ filtrace_bezi }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.filtrace_switch
        - action: notify.mobile_app_evzen_iphone
          data:
            title: Filtrace vypnuta
            message: Nedostatek solárů - filtrace vypnuta přednostně, aby nabíjení
              EV mohlo pokračovat na 6A.
        - delay: 0:01:00
        - condition: template
          value_template: '{{ (states(''sensor.energy_buy'') | float(0) > 1500) or
            (states(''sensor.fve_battery_discharge_w'') | float(0) > 2000) }}'
      - action: switch.turn_off
        target:
          entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - if:
        - condition: numeric_state
          entity_id: sensor.current_spot_electricity_price
          below: 0
        then:
        - action: number.set_value
          target:
            entity_id: number.goodwe_limit_dodavky_do_site
          data:
            value: 0
      - action: notify.mobile_app_evzen_iphone
        data:
          title: EV nabíjení zastaveno
          message: Import ze sítě nebo vybíjení baterie kryje EV i při minimu 6A.
            Nabíjení zastaveno.
  mode: single
- id: ev_nabijeni_nt_manualni_start
  alias: EV nabíjení NT - manuální start
  description: Manuální nabíjení EV za nízký tarif (CEZ HDO). Spustí se zapnutím
    input_boolean.ev_nabijeni_manualni_nt (nebo pokud je už zapnuté, začátkem NT)
    a zamkne domácí baterii (GoodWe eco_charge, výkon 0 %), aby spotřeba domu i
    EV šla ze sítě a baterie se zbytečně nevybíjela. Zaznamená stav energie a
    aktuální NT cenu pro pozdější dopočet nákladů session (viz stop automatika).
  triggers:
  - trigger: state
    entity_id: input_boolean.ev_nabijeni_manualni_nt
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.cez_hdo_lowtariffactive_dum
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.ev_nabijeni_povoleno
    state: 'on'
  - condition: state
    entity_id: input_boolean.ev_nabijeni_manualni_nt
    state: 'on'
  - condition: state
    entity_id: binary_sensor.cez_hdo_lowtariffactive_dum
    state: 'on'
  - condition: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ecovolter_revcr01c00002056_is_vehicle_connected
    state: 'on'
  - condition: template
    value_template: '{{ states(''sensor.ev6_ev_battery_level'') in [''unavailable'',
      ''unknown''] or states(''sensor.ev6_ev_battery_level'') | int(0) < (states(''number.ev6_ac_charging_limit'')
      | int(80)) }}'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.ev_nt_start_energie_kwh
    data:
      value: '{{ states(''sensor.ecovolter_revcr01c00002056_total_charged_energy'')
        | float(0) }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.ev_nt_start_cena_kc_kwh
    data:
      value: '{{ states(''sensor.cez_hdo_currentprice_dum'') | float(0) }}'
  - action: select.select_option
    target:
      entity_id: select.goodwe_provozni_rezim_stridace
    data:
      option: eco_charge
  - delay: 0:00:05
  - action: number.set_value
    target:
      entity_id: number.goodwe_vykon_v_ekonomickem_rezimu
    data:
      value: 0
  - delay: 0:00:05
  - action: number.set_value
    target:
      entity_id: number.ecovolter_revcr01c00002056_target_current
    data:
      value: 6
  - action: switch.turn_on
    target:
      entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
  - wait_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
      | float(0) > 0.3 }}'
    timeout: 0:01:30
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ states(''sensor.ecovolter_revcr01c00002056_actual_power'')
        | float(0) <= 0.3 }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    - action: select.select_option
      target:
        entity_id: select.goodwe_provozni_rezim_stridace
      data:
        option: general
    - action: notify.mobile_app_evzen_iphone
      data:
        title: EV nabíjení NT - chyba
        message: Auto nepřijímá nabíjení. NT manuální nabíjení zrušeno, baterie odemčena.
    else:
    - action: number.set_value
      target:
        entity_id: number.ecovolter_revcr01c00002056_target_current
      data:
        value: 11
    - action: notify.mobile_app_evzen_iphone
      data:
        title: EV nabíjení NT spuštěno
        message: Nízký tarif aktivní. Nabíjení EV 11A, domácí baterie zamčena (eco_charge,
          0 %) — spotřeba domu i EV jde ze sítě.
  mode: single
- id: ev_nabijeni_nt_manualni_stop
  alias: EV nabíjení NT - manuální stop
  description: Ukončí NT manuální nabíjení a odemkne domácí baterii (GoodWe general
    mode) při konci NT tarifu, vypnutí input_boolean nebo zastavení nabíjení EV —
    podle toho, co nastane dřív. Nedělá nic, pokud NT manuální režim nebyl aktivní.
    Spočítá spotřebu a náklady session (energie teď minus snapshot při startu ×
    NT cena při startu) a přičte je do celoživotních akumulátorů pro měsíční
    utility_meter (sensor.ev_nt_energie_mesic, sensor.ev_nt_naklady_mesic).
  triggers:
  - trigger: state
    entity_id: input_boolean.ev_nabijeni_manualni_nt
    to: 'off'
    id: boolean_off
  - trigger: state
    entity_id: binary_sensor.cez_hdo_lowtariffactive_dum
    to: 'off'
    id: hdo_off
  - trigger: state
    entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
    to: 'off'
    id: charging_off
  conditions:
  - condition: template
    value_template: '{{ is_state(''input_boolean.ev_nabijeni_manualni_nt'', ''on'')
      or is_state(''select.goodwe_provozni_rezim_stridace'', ''eco_charge'') }}'
  actions:
  - variables:
      energie_pri_startu: '{{ states(''input_number.ev_nt_start_energie_kwh'') |
        float(0) }}'
      cena_pri_startu: '{{ states(''input_number.ev_nt_start_cena_kc_kwh'') | float(0)
        }}'
      energie_ted: '{{ states(''sensor.ecovolter_revcr01c00002056_total_charged_energy'')
        | float(0) }}'
      session_kwh: '{{ [energie_ted - energie_pri_startu, 0] | max }}'
      session_kc: '{{ session_kwh * cena_pri_startu }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.ev_nt_energie_celkem_kwh
    data:
      value: '{{ (states(''input_number.ev_nt_energie_celkem_kwh'') | float(0)) +
        session_kwh }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.ev_nt_naklady_celkem_kc
    data:
      value: '{{ (states(''input_number.ev_nt_naklady_celkem_kc'') | float(0)) +
        session_kc }}'
  - if:
    - condition: not
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''charging_off'' }}'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
  - if:
    - condition: state
      entity_id: select.goodwe_provozni_rezim_stridace
      state: eco_charge
    then:
    - action: select.select_option
      target:
        entity_id: select.goodwe_provozni_rezim_stridace
      data:
        option: general
    - delay: 0:00:05
    - action: number.set_value
      target:
        entity_id: number.goodwe_vykon_v_ekonomickem_rezimu
      data:
        value: 0
  - if:
    - condition: state
      entity_id: input_boolean.ev_nabijeni_manualni_nt
      state: 'on'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_nabijeni_manualni_nt
  - action: notify.mobile_app_evzen_iphone
    data:
      title: EV nabíjení NT ukončeno
      message: '{% if trigger.id == ''hdo_off'' %} Nízký tarif skončil. {% elif trigger.id
        == ''charging_off'' %} Nabíjení EV se zastavilo. {% else %} Manuální NT nabíjení
        vypnuto. {% endif %} Domácí baterie odemčena (general mode). Tato session:
        {{ session_kwh | round(2) }} kWh, {{ session_kc | round(1) }} Kč.'
  mode: single
- id: ev_blokovat_vybijeni_baterie
  alias: EV - blokovat vybíjení baterie při plánovaném nabíjení
  description: Pokud je plánováno nabíjení EV (ev_nabijeni_povoleno = on) a baterie
    EV je pod nabíjecím limitem, zakazuje automatizace vybíjení domácí baterie do
    sítě. Po dosažení limitu nebo zakázání nabíjení vybíjení obnoví.
  triggers:
  - trigger: state
    entity_id: input_boolean.ev_nabijeni_povoleno
  - trigger: state
    entity_id: sensor.ev6_ev_battery_level
  - trigger: state
    entity_id: number.ev6_ac_charging_limit
  conditions: []
  actions:
  - variables:
      je_povoleno: '{{ is_state(''input_boolean.ev_nabijeni_povoleno'', ''on'') }}'
      ev6_soc: '{{ states(''sensor.ev6_ev_battery_level'') | int(-1) }}'
      ev6_limit: '{{ states(''number.ev6_ac_charging_limit'') | int(80) }}'
      ev6_soc_ok: '{{ states(''sensor.ev6_ev_battery_level'') not in [''unavailable'',
        ''unknown''] }}'
      treba_blokovat: '{{ je_povoleno and ev6_soc_ok and ev6_soc < ev6_limit }}'
      uz_blokovano: '{{ is_state(''automation.discharge_battery_to_the_grid'', ''off'')
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ treba_blokovat and not uz_blokovano }}'
      sequence:
      - action: automation.turn_off
        target:
          entity_id:
          - automation.discharge_battery_to_the_grid
          - automation.eco_discharge_when_low_price_at_noon
          - automation.turn_off_eco_discharge_mode_when_peak
      - action: notify.mobile_app_evzen_iphone
        data:
          title: EV nabíjení - priorita baterie
          message: EV {{ ev6_soc }}% < limit {{ ev6_limit }}%. Vybíjení domácí baterie
            do sítě blokováno.
    - conditions:
      - condition: template
        value_template: '{{ not treba_blokovat and uz_blokovano }}'
      sequence:
      - action: automation.turn_on
        target:
          entity_id:
          - automation.discharge_battery_to_the_grid
          - automation.eco_discharge_when_low_price_at_noon
          - automation.turn_off_eco_discharge_mode_when_peak
      - action: notify.mobile_app_evzen_iphone
        data:
          title: EV nabíjení - vybíjení obnoveno
          message: EV dosáhlo limitu nebo nabíjení zakázáno. Vybíjení domácí baterie
            do sítě opět povoleno.
  mode: queued
  max: 3
- id: '1778526312883'
  alias: Run PND
  description: ''
  triggers:
  - at: 00:30:00
    trigger: time
  conditions: []
  actions:
  - event: run_pnd
    event_data: {}
  mode: single
- id: '1778526595548'
  alias: Run actions after AppDaemon starts
  description: Spustí PND po startu AppDaemonu s prodlevou 15 sekund pro zajištění
    závislostí
  triggers:
  - event_type: APPDAEMON_READY
    trigger: event
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - event: run_pnd
    event_data: {}
  mode: single

# HAv2 – datová vrstva (Fáze 3, krok 1), docs/hav2-architektura.md §3
# Jen čte a počítá – nic neřídí.
# Konvence: meter_active_power_lX kladné = dodávka do sítě, záporné = odběr.

sensor:
  # vyhlazený přebytek pro regulaci EV a filtrace
  - platform: statistics
    name: energy_surplus_smoothed_w
    unique_id: hav2_energy_surplus_smoothed_w
    entity_id: sensor.energy_surplus_w
    state_characteristic: mean
    max_age:
      seconds: 90
    sampling_size: 60
    precision: 0
  # 5min průměr napěťového indexu bojleru (L3 mimo měření GoodWe)
  - platform: statistics
    name: energy_boiler_voltage_index_5min
    unique_id: hav2_energy_boiler_voltage_index_5min
    entity_id: sensor.energy_boiler_voltage_index
    state_characteristic: mean
    max_age:
      minutes: 5
    sampling_size: 200
    precision: 2
  # hodiny filtrace v bazénovém dni 06:00–06:00 – skutečný běh čerpadla (měření Pro EM-50)
  - platform: history_stats
    name: pool_hours_done_today
    unique_id: hav2_pool_hours_done_today
    entity_id: binary_sensor.pool_pump_running
    state: "on"
    type: time
    start: >
      {{ today_at('06:00') if now() >= today_at('06:00') else today_at('06:00') - timedelta(days=1) }}
    end: "{{ now() }}"

template:
  - sensor:
      - name: Filtrace odběhnuto dnes
        unique_id: hav2_pool_hours_done
        default_entity_id: sensor.pool_hours_done
        unit_of_measurement: h
        state_class: measurement
        icon: mdi:timer-sand-complete
        # bazénový den 06:00–06:00: skutečný běh čerpadla
        availability: "{{ has_value('sensor.pool_hours_done_today') }}"
        state: "{{ states('sensor.pool_hours_done_today') | float(0) | round(2) }}"

      # ----------------------------------------------------------- bojler (L3)
      - name: Napěťový index bojleru
        unique_id: hav2_energy_boiler_voltage_index
        default_entity_id: sensor.energy_boiler_voltage_index
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        icon: mdi:water-boiler
        # (L1+L2)/2 − L3: bojler 2,25 kW na L3 (mimo GoodWe) prohne L3 o ~3 V.
        # EV v 1f nabíjí na L1 a L1 prohne → index by ohřev zamaskoval, proto pak jen L2 − L3.
        availability: >
          {{ ['sensor.on_grid_l1_voltage', 'sensor.on_grid_l2_voltage', 'sensor.on_grid_l3_voltage']
             | select('has_value') | list | count == 3 }}
        state: >
          {% set l1 = states('sensor.on_grid_l1_voltage') | float %}
          {% set l2 = states('sensor.on_grid_l2_voltage') | float %}
          {% set l3 = states('sensor.on_grid_l3_voltage') | float %}
          {% set ev_1f = states('sensor.ecovolter_revcr01c00002056_actual_power') | float(0) > 0.3
                         and is_state('switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable', 'off') %}
          {{ ((l2 - l3) if ev_1f else ((l1 + l2) / 2 - l3)) | round(2) }}
        attributes:
          method: >
            {{ 'L2 − L3 (EV nabíjí 1f na L1)'
               if states('sensor.ecovolter_revcr01c00002056_actual_power') | float(0) > 0.3
                  and is_state('switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable', 'off')
               else '(L1 + L2) / 2 − L3' }}

      - name: Bojler odhad příkonu
        unique_id: hav2_energy_boiler_power_w
        default_entity_id: sensor.energy_boiler_power_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:water-boiler
        # Od 1. 10. 2026 měření Shelly Pro EM-50 (snímač na L3 nad SSR3; plynulá regulace WATTrouteru
        # pulzuje 0–2,2 kW, účiník pak ~0,45 – činný výkon platí). Záloha při výpadku měření:
        # z přetoku GoodWe na L3 (bojler je před měřením GoodWe), v noci 22–06 plný výkon.
        availability: >
          {{ has_value('sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon')
             or (has_value('binary_sensor.energy_boiler_heating') and has_value('sensor.meter_active_power_l3')) }}
        state: >
          {% set m = 'sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon' %}
          {% if has_value(m) %}{{ [states(m) | float(0), 0] | max | round(0) }}
          {% elif is_state('binary_sensor.energy_boiler_heating', 'on') %}
            {% if now().hour >= 22 or now().hour < 6 %}2250
            {% else %}{{ [[states('sensor.meter_active_power_l3') | float, 0] | max, 2250] | min | round(0) }}{% endif %}
          {% else %}0{% endif %}
        attributes:
          source: >
            {{ 'měření' if has_value('sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon') else 'odhad (měření nedostupné)' }}

      # ------------------------------------------------------- přebytek a fáze
      - name: Přebytek pro řízené spotřebiče
        unique_id: hav2_energy_surplus_w
        default_entity_id: sensor.energy_surplus_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power-variant
        # FVE − dům bez EV a filtrace; kladné = k dispozici. Bojler (plynulá regulace WATTrouteru)
        # bere jen zbytek přetoku na L3 → odečíst jen s prioritou bojleru nebo při nuceném ohřevu.
        availability: "{{ has_value('sensor.pv_power') and has_value('sensor.base_house_consumption') }}"
        state: >
          {% set boiler = states('sensor.energy_boiler_power_w') | float(0)
             if is_state('input_boolean.ev_boiler_priority', 'on') or now().hour >= 22 or now().hour < 6 else 0 %}
          {{ (states('sensor.pv_power') | float - states('sensor.base_house_consumption') | float - boiler) | round(0) }}

      - name: Rezerva fáze L1
        unique_id: hav2_energy_phase_headroom_l1_w
        default_entity_id: sensor.energy_phase_headroom_l1_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:sine-wave
        # baterie umí dorovnávat → celkový přebytek; jinak přetok fáze
        availability: "{{ has_value('sensor.energy_surplus_smoothed_w') and has_value('sensor.meter_active_power_l1') }}"
        state: >
          {% set soc = states('sensor.battery_state_of_charge') | float(0) %}
          {% set minsoc = states('input_number.energy_battery_min_soc') | float(20) %}
          {% if minsoc + 2 < soc < 97 %}{{ states('sensor.energy_surplus_smoothed_w') | float | round(0) }}
          {% else %}{{ states('sensor.meter_active_power_l1') | float | round(0) }}{% endif %}
      - name: Rezerva fáze L2
        unique_id: hav2_energy_phase_headroom_l2_w
        default_entity_id: sensor.energy_phase_headroom_l2_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:sine-wave
        availability: "{{ has_value('sensor.energy_surplus_smoothed_w') and has_value('sensor.meter_active_power_l2') }}"
        state: >
          {% set soc = states('sensor.battery_state_of_charge') | float(0) %}
          {% set minsoc = states('input_number.energy_battery_min_soc') | float(20) %}
          {% if minsoc + 2 < soc < 97 %}{{ states('sensor.energy_surplus_smoothed_w') | float | round(0) }}
          {% else %}{{ states('sensor.meter_active_power_l2') | float | round(0) }}{% endif %}
      - name: Rezerva fáze L3
        unique_id: hav2_energy_phase_headroom_l3_w
        default_entity_id: sensor.energy_phase_headroom_l3_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:sine-wave
        # na L3 navíc bojler mimo GoodWe (stejné pravidlo jako u přebytku)
        availability: "{{ has_value('sensor.energy_surplus_smoothed_w') and has_value('sensor.meter_active_power_l3') }}"
        state: >
          {% set soc = states('sensor.battery_state_of_charge') | float(0) %}
          {% set minsoc = states('input_number.energy_battery_min_soc') | float(20) %}
          {% set boiler = states('sensor.energy_boiler_power_w') | float(0)
             if is_state('input_boolean.ev_boiler_priority', 'on') or now().hour >= 22 or now().hour < 6 else 0 %}
          {% if minsoc + 2 < soc < 97 %}{{ states('sensor.energy_surplus_smoothed_w') | float | round(0) }}
          {% else %}{{ (states('sensor.meter_active_power_l3') | float - boiler) | round(0) }}{% endif %}

      - name: Rezerva hlavního jističe
        unique_id: hav2_energy_breaker_headroom_a
        default_entity_id: sensor.energy_breaker_headroom_a
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        icon: mdi:electric-switch
        # 25 A − nejvíc zatížená fáze ze sítě; L3 ze sítě = bojler (mimo GoodWe) − přetok GoodWe na L3
        availability: >
          {{ ['sensor.meter_active_power_l1', 'sensor.meter_active_power_l2', 'sensor.meter_active_power_l3']
             | select('has_value') | list | count == 3 }}
        state: >
          {% set boiler = states('sensor.energy_boiler_power_w') | float(0) %}
          {% set i1 = [0 - states('sensor.meter_active_power_l1') | float, 0] | max / 230 %}
          {% set i2 = [0 - states('sensor.meter_active_power_l2') | float, 0] | max / 230 %}
          {% set i3 = [boiler - states('sensor.meter_active_power_l3') | float, 0] | max / 230 %}
          {{ (25 - [i1, i2, i3] | max) | round(1) }}
        attributes:
          worst_phase: >
            {% set boiler = states('sensor.energy_boiler_power_w') | float(0) %}
            {% set i = [[0 - states('sensor.meter_active_power_l1') | float(0), 0] | max / 230,
                        [0 - states('sensor.meter_active_power_l2') | float(0), 0] | max / 230,
                        [boiler - states('sensor.meter_active_power_l3') | float(0), 0] | max / 230] %}
            L{{ i.index(i | max) + 1 }}

      # ---------------------------------------------------------- hodnota kWh
      - name: Hodnota kWh z FVE teď
        unique_id: hav2_energy_value_pv_now
        default_entity_id: sensor.energy_value_pv_now
        unit_of_measurement: Kč/kWh
        icon: mdi:solar-power
        # ušlý prodej = max(spot × koeficient, 0)
        availability: "{{ has_value('sensor.energy_price_sell_now') }}"
        state: "{{ [states('sensor.energy_price_sell_now') | float, 0] | max | round(3) }}"

      # ------------------------------------------------ opravená předpověď FVE
      - name: Předpověď FVE opravená
        unique_id: hav2_energy_pv_forecast_corrected
        default_entity_id: sensor.energy_pv_forecast_corrected
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:solar-power-variant-outline
        # stav = opravený zbytek dnešního dne; sloty po 30 min (kW) dnes + zítra
        availability: "{{ state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast') is not none }}"
        state: >
          {% from 'hav2.jinja' import pv_corrected_slots %}
          {% set slots = pv_corrected_slots(state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast')) | from_json %}
          {% set ns = namespace(e=0) %}
          {% for s in slots %}
            {% set start = s[0] | as_datetime %}
            {% if start + timedelta(minutes=30) > now() %}
              {% set frac = 1 if start >= now() else (start + timedelta(minutes=30) - now()).total_seconds() / 1800 %}
              {% set ns.e = ns.e + s[1] * 0.5 * frac %}
            {% endif %}
          {% endfor %}
          {{ ns.e | round(2) }}
        attributes:
          today_kwh: >
            {% from 'hav2.jinja' import pv_corrected_slots %}
            {{ ((pv_corrected_slots(state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast')) | from_json)
                | map(attribute=1) | sum * 0.5) | round(2) }}
          tomorrow_kwh: >
            {% from 'hav2.jinja' import pv_corrected_slots %}
            {{ ((pv_corrected_slots(state_attr('sensor.solcast_pv_forecast_forecast_tomorrow', 'detailedForecast')) | from_json)
                | map(attribute=1) | sum * 0.5) | round(2) }}
          tomorrow_conservative_kwh: >
            {% from 'hav2.jinja' import pv_conservative_factor %}
            {% set t = now() + timedelta(days=1) %}
            {{ (states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0)
                * pv_conservative_factor(t.month) | float) | round(2) }}
          solcast_raw_today_kwh: "{{ states('sensor.solcast_pv_forecast_forecast_today') | float(0) }}"
          solcast_raw_tomorrow_kwh: "{{ states('sensor.solcast_pv_forecast_forecast_tomorrow') | float(0) }}"
          # 7 dní pro dashboard: [datum, Solcast p50, p50 × měsíční faktor, p10 × měsíční faktor] (kWh)
          week: >
            {% from 'hav2.jinja' import pv_month_factor %}
            {% set ns = namespace(out=[]) %}
            {% for k in ['today', 'tomorrow', 'day_3', 'day_4', 'day_5', 'day_6', 'day_7'] %}
              {% set e = 'sensor.solcast_pv_forecast_forecast_' ~ k %}
              {% set d = (now() + timedelta(days=loop.index0)).date() %}
              {% set f = pv_month_factor(d.month) | float %}
              {% set raw = states(e) | float(0) %}
              {% set ns.out = ns.out + [[d.isoformat(), raw | round(1), (raw * f) | round(1),
                  (state_attr(e, 'estimate10') | float(raw) * f) | round(1)]] %}
            {% endfor %}
            {{ ns.out }}
          slots: >
            {% from 'hav2.jinja' import pv_corrected_slots %}
            {{ (pv_corrected_slots(state_attr('sensor.solcast_pv_forecast_forecast_today', 'detailedForecast')) | from_json)
               + (pv_corrected_slots(state_attr('sensor.solcast_pv_forecast_forecast_tomorrow', 'detailedForecast')) | from_json) }}

      # ---------------------------------------------------------------- EV
      - name: EV potřebná energie
        unique_id: hav2_ev_energy_needed_kwh
        default_entity_id: sensor.ev_energy_needed_kwh
        unit_of_measurement: kWh
        device_class: energy
        icon: mdi:ev-plug-type2
        # (cíl − odhad SOC) × kapacita / účinnost nabíjení
        availability: "{{ has_value('sensor.ev_soc_estimate') }}"
        state: >
          {% set diff = states('input_number.ev_target_soc') | float(80) - states('sensor.ev_soc_estimate') | float %}
          {{ ([diff, 0] | max / 100 * states('input_number.ev_battery_capacity_kwh') | float(77.4)
              / (states('input_number.ev_charge_efficiency') | float(90) / 100)) | round(2) }}

      - name: EV rezerva do termínu
        unique_id: hav2_ev_deadline_slack_h
        default_entity_id: sensor.ev_deadline_slack_h
        unit_of_measurement: h
        device_class: duration
        icon: mdi:calendar-clock
        # hodiny do termínu − hodiny nabíjení na max. výkon (3f 11 A ≈ 7 kW)
        # bez termínu (nebo s termínem v minulosti) je senzor nedostupný
        availability: >
          {% set d = states('input_datetime.ev_deadline') | as_datetime(none) %}
          {{ d is not none and (d | as_local) > now() and has_value('sensor.ev_energy_needed_kwh') }}
        state: >
          {% set d = (states('input_datetime.ev_deadline') | as_datetime) | as_local %}
          {% set hours_left = (d - now()).total_seconds() / 3600 %}
          {{ (hours_left - states('sensor.ev_energy_needed_kwh') | float / 7.0) | round(2) }}

      # -------------------------------------------------------------- bazén
      - name: Filtrace doporučené hodiny
        unique_id: hav2_pool_hours_recommended
        default_entity_id: sensor.pool_hours_recommended
        unit_of_measurement: h
        device_class: duration
        icon: mdi:pool-thermometer
        # < 12 °C minimum, do 18 °C teplota / 3, od 22 °C teplota / 2, mezi tím plynule;
        # +1 h při ORP < 650 mV; omezeno min/max
        availability: "{{ has_value('sensor.pool_water_temperature') }}"
        state: >
          {% set t = states('sensor.pool_water_temperature') | float %}
          {% set k = ([[(t - 18) / 4, 0] | max, 1] | min) %}
          {% set base = 0 if t < 12 else t / 3 + (t / 2 - t / 3) * k %}
          {% set h = base + (1 if states('sensor.davkovac_orp') | float(700) < 650 else 0) %}
          {% set h = [[h, states('input_number.pool_hours_min') | float(2)] | max,
                      states('input_number.pool_hours_max') | float(12)] | min %}
          {{ (h * 2) | round(0) / 2 }}

  # -------------------------------------------------- EV: odhad SOC
  - triggers:
      - trigger: state
        entity_id: sensor.ev6_ev_battery_level
        id: kia
      - trigger: state
        entity_id: sensor.ecovolter_revcr01c00002056_total_charged_energy
        id: energy
      - trigger: homeassistant
        event: start
        id: start
      - trigger: event
        event_type: event_template_reloaded
        id: reload
    # `this` není ve `variables` trigger šablony dostupné → logika je přímo v šablonách
    # (všechny vidí stejný předchozí stav entity, takže jsou konzistentní)
    sensor:
      - name: EV odhad SOC
        unique_id: hav2_ev_soc_estimate
        default_entity_id: sensor.ev_soc_estimate
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:car-electric
        # Kia SOC (staré i hodiny) + energie nabitá od té doby × účinnost / kapacita.
        # Na Kia SOC se přebázuje jen tehdy, když jsou data z auta novější než báze.
        state: >
          {% set total_now = states('sensor.ecovolter_revcr01c00002056_total_charged_energy') | float(0) %}
          {% set kia_soc = states('sensor.ev6_ev_battery_level') %}
          {% set kia_time = states('sensor.ev6_last_updated_at') | as_datetime(none) %}
          {% set base_time = this.attributes.get('base_time') | as_datetime(none) if this.attributes.get('base_time') else none %}
          {% set rebase = kia_soc | is_number and (base_time is none or (kia_time is not none and kia_time > base_time)) %}
          {% set base_soc = kia_soc | float if rebase else this.attributes.get('base_soc', kia_soc) | float(50) %}
          {% set base_energy = total_now if rebase else this.attributes.get('base_energy', total_now) | float %}
          {% set added = (total_now - base_energy) * states('input_number.ev_charge_efficiency') | float(90) / 100 %}
          {{ [[base_soc + added / states('input_number.ev_battery_capacity_kwh') | float(77.4) * 100, 0] | max, 100] | min | round(1) }}
        attributes:
          base_soc: >
            {% set kia_soc = states('sensor.ev6_ev_battery_level') %}
            {% set kia_time = states('sensor.ev6_last_updated_at') | as_datetime(none) %}
            {% set base_time = this.attributes.get('base_time') | as_datetime(none) if this.attributes.get('base_time') else none %}
            {% set rebase = kia_soc | is_number and (base_time is none or (kia_time is not none and kia_time > base_time)) %}
            {{ kia_soc | float if rebase else this.attributes.get('base_soc', kia_soc) | float(50) }}
          base_energy: >
            {% set total_now = states('sensor.ecovolter_revcr01c00002056_total_charged_energy') | float(0) %}
            {% set kia_soc = states('sensor.ev6_ev_battery_level') %}
            {% set kia_time = states('sensor.ev6_last_updated_at') | as_datetime(none) %}
            {% set base_time = this.attributes.get('base_time') | as_datetime(none) if this.attributes.get('base_time') else none %}
            {% set rebase = kia_soc | is_number and (base_time is none or (kia_time is not none and kia_time > base_time)) %}
            {{ total_now if rebase else this.attributes.get('base_energy', total_now) | float }}
          base_time: >
            {% set kia_soc = states('sensor.ev6_ev_battery_level') %}
            {% set kia_time = states('sensor.ev6_last_updated_at') | as_datetime(none) %}
            {% set base_time = this.attributes.get('base_time') | as_datetime(none) if this.attributes.get('base_time') else none %}
            {% set rebase = kia_soc | is_number and (base_time is none or (kia_time is not none and kia_time > base_time)) %}
            {{ (kia_time.isoformat() if kia_time is not none else now().isoformat()) if rebase else this.attributes.get('base_time') }}
          source: >
            {% set kia_time = states('sensor.ev6_last_updated_at') | as_datetime(none) %}
            {% set base_time = this.attributes.get('base_time') | as_datetime(none) if this.attributes.get('base_time') else none %}
            {{ 'kia' if states('sensor.ev6_ev_battery_level') | is_number
                        and (base_time is none or (kia_time is not none and kia_time > base_time))
               else 'odhad z nabité energie' }}

  # -------------------------------------- bazén: teplota vody jen při běhu čerpadla
  # spouští se změnou teploty, 10 min po zapnutí čerpadla a pak každých 10 min běhu
  - triggers:
      - trigger: state
        entity_id: sensor.davkovac_teplota
      - trigger: state
        entity_id: binary_sensor.pool_pump_running
        to: "on"
        for:
          minutes: 10
      - trigger: time_pattern
        minutes: /10
    conditions:
      - condition: state
        entity_id: binary_sensor.pool_pump_running
        state: "on"
        for:
          minutes: 10
      - condition: template
        value_template: "{{ states('sensor.davkovac_teplota') | is_number }}"
    sensor:
      - name: Teplota vody v bazénu
        unique_id: hav2_pool_water_temperature
        default_entity_id: sensor.pool_water_temperature
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        icon: mdi:pool-thermometer
        # PoolDose měří v cele – platné jen po 10 min běhu filtrace
        state: "{{ states('sensor.davkovac_teplota') | float }}"

  - binary_sensor:
      # Solcast automatické tlumení: vyřadit půlhodiny, kdy HAv2 omezuje přetok (záporný výkup,
      # NegPriceBoiler) → výroba je uměle snížená, ne stínem. Název entity určuje integrace.
      - name: Solcast potlačit automatické tlumení
        unique_id: hav2_solcast_suppress_auto_dampening
        default_entity_id: binary_sensor.solcast_suppress_auto_dampening
        icon: mdi:solar-power-variant-outline
        state: "{{ states('number.goodwe_limit_dodavky_do_site') | float(10000) < 10000 }}"

      - name: Čerpadlo filtrace běží
        unique_id: hav2_pool_pump_running
        default_entity_id: binary_sensor.pool_pump_running
        device_class: running
        icon: mdi:pump
        # skutečný běh podle měření Pro EM-50 (zachytí i MANUAL/VYPNUTO na venkovních vypínačích);
        # při výpadku měření záloha = stav relé
        state: >
          {% set p = 'sensor.shellyproem50_841fe890fc44_energy_meter_0_vykon' %}
          {% if has_value(p) %}{{ states(p) | float(0) > 150 }}
          {% else %}{{ is_state('switch.shellyproem50_841fe890fc44', 'on') }}{% endif %}
        attributes:
          source: >
            {{ 'měření' if has_value('sensor.shellyproem50_841fe890fc44_energy_meter_0_vykon') else 'stav relé (měření nedostupné)' }}

      - name: Bojler hřeje
        unique_id: hav2_energy_boiler_heating
        default_entity_id: binary_sensor.energy_boiler_heating
        device_class: heat
        icon: mdi:water-boiler
        # kalibrace proti hodinovým datům PND 16.–25. 9. (bojler = PND − GoodWe, 45 kWh / 10 dní):
        # nucený ohřev zapnout od 1,0 V, polední ohřev z přetoků od 2,5 V, vypnout pod 0,5 V.
        # Nucený ohřev = časový plán WATTrouteru SSR3 „vynutit“ 22:00–06:00 (od 29. 9. 2026, dříve
        # 16–19 h); při změně plánu ve WATTconfigu upravit i zde. Polední okno 12–20 h; jinak nikdy.
        # Chyba po hodinách 17 kWh / 10 dní, denní součty ±1 kWh. Přesnou denní spotřebu dává
        # sensor.energy_boiler_pnd_daily (D+1).
        # Od 1. 10. 2026 primárně měření Shelly: zapnout nad 1 000 W, vypnout pod 300 W (pulzní
        # regulace kolísá po sekundách, drží delay_off). Napěťový index jen jako záloha.
        delay_off:
          minutes: 3
        availability: >
          {{ has_value('sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon')
             or has_value('sensor.energy_boiler_voltage_index_5min') }}
        state: >
          {% set m = 'sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon' %}
          {% set on = is_state('binary_sensor.energy_boiler_heating', 'on') %}
          {% if has_value(m) %}
            {{ states(m) | float(0) > (300 if on else 1000) }}
          {% else %}
            {% set idx = states('sensor.energy_boiler_voltage_index_5min') | float %}
            {% set forced = now().hour >= 22 or now().hour < 6 %}
            {% set in_window = forced or 12 <= now().hour < 20 %}
            {% set on_th = 1.0 if forced else 2.5 %}
            {{ in_window and idx > (0.5 if on else on_th) }}
          {% endif %}
        attributes:
          source: >
            {{ 'měření' if has_value('sensor.shellyproem50_ece334fd2370_energy_meter_0_vykon') else 'napěťový index (záloha)' }}

      - name: Předpověď FVE platná
        unique_id: hav2_energy_forecast_valid
        default_entity_id: binary_sensor.energy_forecast_valid
        device_class: connectivity
        icon: mdi:weather-sunny-alert
        # Solcast aktualizoval do 14 h (přes noc neaktualizuje) a má zítřek
        state: >
          {% set polled = states('sensor.solcast_pv_forecast_api_last_polled') | as_datetime(none) %}
          {{ polled is not none and (now() - polled).total_seconds() < 14 * 3600
             and states('sensor.solcast_pv_forecast_forecast_tomorrow') | is_number }}

  # ------------------------------------------------ EV náklady – souhrny pro dashboard
  - sensor:
      - name: EV nabito celkem
        unique_id: hav2_ev_charging_energy_total
        default_entity_id: sensor.ev_charging_energy_total
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:ev-plug-type2
        # součet energie EV podle zdroje (od nasazení HAv2 25. 9. 2026)
        availability: >
          {{ ['sensor.ev_energy_solar_total', 'sensor.ev_energy_battery_total',
              'sensor.ev_energy_grid_nt_total', 'sensor.ev_energy_grid_vt_total'] | select('has_value') | list | count == 4 }}
        state: >
          {{ (['sensor.ev_energy_solar_total', 'sensor.ev_energy_battery_total',
               'sensor.ev_energy_grid_nt_total', 'sensor.ev_energy_grid_vt_total']
              | map('states') | map('float') | sum) | round(3) }}

      - name: EV průměrná cena nabíjení
        unique_id: hav2_ev_charging_avg_price
        default_entity_id: sensor.ev_charging_avg_price
        unit_of_measurement: Kč/kWh
        state_class: measurement
        icon: mdi:cash-check
        availability: "{{ states('sensor.ev_charging_energy_total') | float(0) > 0 and has_value('sensor.ev_charging_cost_total') }}"
        state: >
          {{ (states('sensor.ev_charging_cost_total') | float / states('sensor.ev_charging_energy_total') | float) | round(2) }}

      - name: EV vlastní energie
        unique_id: hav2_ev_own_energy_share
        default_entity_id: sensor.ev_own_energy_share_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:solar-power
        # podíl slunce + baterie domu na nabité energii
        availability: "{{ states('sensor.ev_charging_energy_total') | float(0) > 0 }}"
        state: >
          {{ ((states('sensor.ev_energy_solar_total') | float(0) + states('sensor.ev_energy_battery_total') | float(0))
              / states('sensor.ev_charging_energy_total') | float * 100) | round(0) }}

      - name: EV úspora proti VT tento měsíc
        unique_id: hav2_ev_saving_vs_vt_monthly
        default_entity_id: sensor.ev_saving_vs_vt_monthly
        unit_of_measurement: Kč
        state_class: measurement
        icon: mdi:piggy-bank-outline
        availability: "{{ has_value('sensor.ev_charging_cost_if_vt_monthly') and has_value('sensor.ev_charging_cost_monthly') }}"
        state: >
          {{ (states('sensor.ev_charging_cost_if_vt_monthly') | float - states('sensor.ev_charging_cost_monthly') | float) | round(0) }}

      - name: EV cena na 100 km
        unique_id: hav2_ev_cost_per_100km
        default_entity_id: sensor.ev_cost_per_100km
        unit_of_measurement: Kč
        state_class: measurement
        icon: mdi:road-variant
        # průměrná cena × spotřeba Kia (Wh/km → kWh/100 km) / účinnost nabíjení
        availability: >
          {{ has_value('sensor.ev_charging_avg_price') and states('sensor.ev6_average_energy_consumption') | float(0) > 0 }}
        state: >
          {{ (states('sensor.ev_charging_avg_price') | float * states('sensor.ev6_average_energy_consumption') | float / 10
              / (states('input_number.ev_charge_efficiency') | float(90) / 100)) | round(0) }}

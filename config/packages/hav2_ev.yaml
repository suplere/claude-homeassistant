# HAv2 – výkonná vrstva EV (docs/hav2-architektura.md §2, §5.3, §5.4, §7)
# Jediné místo, které zapisuje do EcoVolteru. Volá ho AppDaemon (hav2_app).
# Povolené rozsahy: proud 6–11 A (strop max_current wallboxu), fáze 1 (L1) nebo 3.
# Přepínání 1f↔3f za běhu ověřeno testem 2026-09-25 (~20 s).

input_boolean:
  ev_control:
    name: HAv2 řídí nabíjení EV
    icon: mdi:ev-station

script:
  hav2_ev_set:
    alias: HAv2 – nastavit nabíjení EV
    description: >
      Nastaví EcoVolter podle regulátoru HAv2: zapnutí nabíjení, proud a počet fází.
      Zapisuje jen při rozdílu proti aktuálnímu stavu a jen když je systém v režimu Auto
      a řízení EV je zapnuté. Proud mimo 6–11 A ořízne.
    icon: mdi:ev-station
    # po sobě jdoucí volání se nesmí přerušit uprostřed zápisu
    mode: queued
    max: 3
    fields:
      enable:
        description: Nabíjet (true) nebo zastavit (false)
        required: true
        example: true
        selector:
          boolean:
      current:
        description: Nabíjecí proud (A)
        required: false
        default: 6
        example: 8
        selector:
          number:
            min: 6
            max: 11
            step: 1
            unit_of_measurement: A
      phases:
        description: Počet fází (1 = jen L1, 3)
        required: false
        default: 3
        example: 3
        selector:
          select:
            options: ["1", "3"]
      reason:
        description: Důvod rozhodnutí (do logbooku)
        required: false
        example: přebytek 5200 W → 8 A 3f
        selector:
          text:
    variables:
      charging_switch: switch.ecovolter_revcr01c00002056_is_charging_enable
      current_number: number.ecovolter_revcr01c00002056_target_current
      phase_switch: switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable
      want_enable: "{{ enable | bool(false) }}"
      want_current: "{{ [[current | int(6), 6] | max, 11] | min }}"
      want_3f: "{{ (phases | int(3)) == 3 }}"
    sequence:
      - alias: Pojistka – jen v režimu Auto se zapnutým řízením EV
        if:
          - condition: not
            conditions:
              - condition: state
                entity_id: input_select.energy_system_mode
                state: Auto
              - condition: state
                entity_id: input_boolean.ev_control
                state: "on"
        then:
          - action: logbook.log
            data:
              name: HAv2 EV
              message: >
                Nezapsáno (režim {{ states('input_select.energy_system_mode') }}):
                {{ 'nabíjet' if want_enable else 'stop' }} {{ want_current }} A {{ 3 if want_3f else 1 }}f
              entity_id: script.hav2_ev_set
          - stop: Systém není v režimu Auto se zapnutým řízením EV
      - alias: Pojistka – wallbox dostupný
        if:
          - condition: template
            value_template: "{{ not has_value(charging_switch) or not has_value(current_number) }}"
        then:
          - stop: EcoVolter nedostupný
      - alias: Zastavit
        if:
          - condition: template
            value_template: "{{ not want_enable }}"
        then:
          - if:
              - condition: template
                value_template: "{{ is_state(charging_switch, 'on') }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
              - action: logbook.log
                data:
                  name: HAv2 EV
                  message: "Stop – {{ reason | default('') }}"
                  entity_id: script.hav2_ev_set
          - stop: Nabíjení zastaveno
      - alias: Fáze (před proudem, ať nový režim nezačne s vyšším proudem)
        if:
          - condition: template
            value_template: "{{ is_state(phase_switch, 'on') != want_3f }}"
        then:
          - if:
              - condition: template
                value_template: "{{ want_3f }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable
            else:
              - action: switch.turn_off
                target:
                  entity_id: switch.ecovolter_revcr01c00002056_is_three_phase_mode_enable
      - alias: Proud
        if:
          - condition: template
            value_template: "{{ states(current_number) | int(0) != want_current }}"
        then:
          - action: number.set_value
            target:
              entity_id: number.ecovolter_revcr01c00002056_target_current
            data:
              value: "{{ want_current }}"
      - alias: Zapnout nabíjení
        if:
          - condition: template
            value_template: "{{ is_state(charging_switch, 'off') }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - action: logbook.log
        data:
          name: HAv2 EV
          message: "{{ want_current }} A {{ 3 if want_3f else 1 }}f – {{ reason | default('') }}"
          entity_id: script.hav2_ev_set

automation:
  - id: hav2_ev_watchdog
    alias: HAv2 – watchdog regulátoru EV
    description: >
      Když AppDaemon 3 min neobnoví heartbeat a systém řídí EV, zastaví nabíjení
      (kromě režimu Rychle a termínu „za každou cenu“, tam nechá 6 A) a pošle notifikaci.
      Po obnovení regulátor sám znovu nastaví nabíjení.
    # jednorázová reakce; další běh až po obnovení a novém výpadku
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{ (now() - (states('input_datetime.hav2_heartbeat') | as_datetime(now()) | as_local)).total_seconds() > 180 }}
    conditions:
      - condition: state
        entity_id: input_select.energy_system_mode
        state: Auto
      - condition: state
        entity_id: input_boolean.ev_control
        state: "on"
      - condition: state
        entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
        state: "on"
    actions:
      - if:
          - condition: or
            conditions:
              - condition: state
                entity_id: input_select.ev_mode
                state: Rychle
              - condition: state
                entity_id: input_boolean.ev_deadline_hard
                state: "on"
        then:
          - action: number.set_value
            target:
              entity_id: number.ecovolter_revcr01c00002056_target_current
            data:
              value: 6
        else:
          - action: switch.turn_off
            target:
              entity_id: switch.ecovolter_revcr01c00002056_is_charging_enable
      - action: input_text.set_value
        target:
          entity_id: input_text.ev_last_decision
        data:
          value: "{{ now().strftime('%H:%M') }} watchdog: regulátor neodpovídá, nabíjení EV omezeno"
      - action: notify.mobile_app_evzen_iphone
        data:
          title: HAv2 – regulátor EV neodpovídá
          message: >
            Heartbeat je starý {{ ((now() - (states('input_datetime.hav2_heartbeat') | as_datetime(now()) | as_local)).total_seconds() / 60) | round(0) }} min.
            Nabíjení EV {{ 'omezeno na 6 A' if is_state('input_select.ev_mode', 'Rychle') or is_state('input_boolean.ev_deadline_hard', 'on') else 'zastaveno' }}.
            Zkontroluj AppDaemon.

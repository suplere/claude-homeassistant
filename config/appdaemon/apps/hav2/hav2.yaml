# HAv2 – AppDaemon konfigurace (docs/hav2-architektura.md §2)
# Samostatný soubor, protože apps.yaml obsahuje přihlašovací údaje a není v gitu.
hav2:
  module: hav2_app
  class: Hav2
  pnd_consumption_stat: "cez_pnd:859182400703740246_consumption"
  pnd_production_stat: "cez_pnd:859182400703740246_production"
  # konec synchronizace integrace ČEZ PND → kontrola bojleru/odchylek (dříve sensor.pnd_data z AppDaemon PND app)
  pnd_sync_entity: binary_sensor.cez_elektromer_8591_0246_synchronizace_pnd_bezi
  # změny, po kterých se plán přepočítá hned (s 30s debounce)
  replan_on:
    - input_select.energy_system_mode
    - input_boolean.energy_battery_control
    - input_number.energy_battery_min_soc
    - input_number.energy_battery_max_grid_charge_w
    - input_number.energy_sell_min_spot
    - input_number.energy_export_block_below
    - input_number.energy_battery_full_every_days
    - binary_sensor.cez_hdo_lowtariffactive_dum
    - binary_sensor.energy_forecast_valid
    - binary_sensor.spot_electricity_has_tomorrow_data_2
    - input_select.ev_mode
    - input_number.ev_target_soc
    - input_number.ev_target_soc_default
    - input_number.ev_car_limit_default
    - input_number.ev_high_soc_window_h
    - number.ev6_ac_charging_limit
    - input_datetime.ev_deadline
    - input_boolean.ev_deadline_hard
    - input_boolean.ev_control
    - input_boolean.pool_control
    - input_boolean.energy_sauna_today
    - input_datetime.energy_sauna_start
    - input_number.energy_sauna_duration_h
    - input_number.energy_sauna_power_kw
